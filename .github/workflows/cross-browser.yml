name: Cross-browser verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_url:
        description: "Optional deployed URL; blank uses the repository server"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  viewport-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        round: [1, 2]
        viewport: ["320x568", "360x740", "375x667", "390x844", "412x915", "430x932", "500x900", "600x960", "768x1024", "568x320", "667x375", "740x360", "844x390", "915x412", "932x430", "1024x768", "1280x720", "1366x768", "1920x1080"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start local server
        if: ${{ inputs.test_url == '' }}
        run: |
          node scripts/test_server.mjs > /tmp/fanhuafenluo-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fanhuafenluo-http.log || true
          exit 1

      - name: Verify viewport
        env:
          TEST_URL: ${{ inputs.test_url || 'http://127.0.0.1:4173/index.html' }}
          TEST_BROWSER: ${{ matrix.browser }}
          TEST_VIEWPORT: ${{ matrix.viewport }}
          TEST_ROUND: ${{ matrix.round }}
          STATIC_VIEWPORT: "1"
        run: npm run test:browser

      - name: Upload failure artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: round-${{ matrix.round }}-${{ matrix.browser }}-${{ matrix.viewport }}
          path: artifacts/round-${{ matrix.round }}/${{ matrix.browser }}/${{ matrix.viewport }}/
          if-no-files-found: ignore
          retention-days: 3

  dynamic-orientation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start local server
        if: ${{ inputs.test_url == '' }}
        run: |
          node scripts/test_server.mjs > /tmp/fanhuafenluo-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fanhuafenluo-http.log || true
          exit 1

      - name: Verify orientation changes
        env:
          TEST_URL: ${{ inputs.test_url || 'http://127.0.0.1:4173/index.html' }}
          TEST_BROWSER: ${{ matrix.browser }}
        run: npm run test:orientation
