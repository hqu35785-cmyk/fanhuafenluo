name: Cross-browser verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/fanhuafenluo-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fanhuafenluo-http.log
          exit 1

      - name: Run two consecutive complete checks
        env:
          TEST_URL: http://127.0.0.1:4173/index.html
        run: npm run test:twice

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-test-artifacts
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
