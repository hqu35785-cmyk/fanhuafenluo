name: Verify gallery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Verify Phase A
        run: npm run verify:phase-a
      - name: Verify Phase B when applied
        shell: bash
        run: |
          if ! grep -R -E "DISPLAY_SLOTS=works.length|fitGalleryToViewport|scheduleGalleryFit|gallery-fit|gallery-row-height" src >/dev/null; then
            npm run verify:phase-b
          else
            echo "Phase B has not been applied; Phase A-only state is allowed."
          fi
      - name: Run complete clean matrix twice
        run: npm run test:matrix:twice
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
