<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>繁花·纷落｜作者作品档案（半成品·未完成）</title>
<style>
:root {
  --bg:#070811;
  --panel:#13131f;
  --panel2:#181624;
  --line:rgba(255,255,255,.09);
  --line-hi:rgba(255,226,237,.18);
  --text:#faf7fc;
  --muted:#9c96aa;
  --pink:#f3aac2;
  --blue:#9db9ff;
  --violet:#c4adff;
  --shadow:0 22px 58px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html{
  min-height:100%;
  scroll-behavior:smooth;
  background:var(--bg);
}
body{
  --mx:68vw;
  --my:22vh;
  min-height:100vh;
  min-height:100dvh;
  margin:0;
  display:flex;
  flex-direction:column;
  overflow-x:clip;
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
  color:var(--text);
  background:
    radial-gradient(900px 540px at -6% -8%,rgba(243,170,194,.14),transparent 58%),
    radial-gradient(780px 520px at 106% 5%,rgba(157,185,255,.12),transparent 60%),
    radial-gradient(700px 420px at 52% 108%,rgba(196,173,255,.055),transparent 66%),
    linear-gradient(180deg,#0b0b16 0%,#080912 54%,#07070d 100%);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  position:relative;
  isolation:isolate;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.19;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);
  background-size:72px 72px;
  -webkit-mask-image:linear-gradient(to bottom,black,transparent 80%);
  mask-image:linear-gradient(to bottom,black,transparent 80%);
}
body::after{
  content:"";
  position:fixed;
  z-index:0;
  left:var(--mx);
  top:var(--my);
  width:min(46vw,720px);
  aspect-ratio:1;
  pointer-events:none;
  border-radius:50%;
  opacity:.16;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(243,170,194,.18),rgba(157,185,255,.075) 34%,transparent 68%);
  filter:blur(32px);
  mix-blend-mode:screen;
  transition:opacity .35s ease;
}
body.modal-open{overflow:hidden}
header,main,footer{position:relative;z-index:1}
::selection{color:#130e18;background:var(--pink)}
button{font:inherit}
img{display:block;max-width:100%}
.sr-only{
  position:absolute!important;
  width:1px!important;
  height:1px!important;
  padding:0!important;
  margin:-1px!important;
  overflow:hidden!important;
  clip:rect(0,0,0,0)!important;
  white-space:nowrap!important;
  border:0!important;
}
.wrap{width:min(3300px,calc(100% - clamp(12px,2.4vw,42px)));margin-inline:auto}

header{
  flex:0 0 auto;
  height:calc(68px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex;
  align-items:center;
  z-index:10;
  border-bottom:0;
  background:linear-gradient(180deg,rgba(18,17,30,.84),rgba(10,10,18,.34));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
  -webkit-backdrop-filter:blur(18px) saturate(125%);
  backdrop-filter:blur(18px) saturate(125%);
}
header::after{
  content:"";
  position:absolute;
  inset:auto 0 0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(243,170,194,.22) 28%,rgba(157,185,255,.18) 72%,transparent);
}
nav{
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:center;
  gap:14px;
}
.brand{display:flex;align-items:center;justify-self:start;min-width:0;gap:10px}
.brand img{
  width:38px;
  height:38px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:12px;
  object-fit:cover;
  box-shadow:0 0 0 3px rgba(243,170,194,.045),0 8px 25px rgba(0,0,0,.38);
}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text .build-state{
  display:block;
  margin-top:5px;
  color:rgba(243,170,194,.72);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:8px;
  font-weight:650;
  letter-spacing:.08em;
  line-height:1;
}
.brand b{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:.2em}
.brand span{
  display:block;
  margin-top:4px;
  color:var(--text);
  font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;
  font-size:17px;
  font-weight:600;
  letter-spacing:.07em;
  text-shadow:0 1px 14px rgba(243,170,194,.12);
}
nav a{color:#d8ced8;text-decoration:none;font-size:12px}
.unlock-all{
  min-width:118px;
  min-height:36px;
  padding:8px 16px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  justify-self:center;
  border:1px solid rgba(243,170,194,.28);
  border-radius:999px;
  color:#fff7fb;
  background:linear-gradient(135deg,rgba(243,170,194,.2),rgba(157,185,255,.12));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 10px 28px rgba(0,0,0,.18),0 0 24px rgba(243,170,194,.06);
  font-size:10px;
  font-weight:700;
  letter-spacing:.12em;
  cursor:pointer;
  transition:transform .2s ease,border-color .2s ease,background .2s ease,color .2s ease,opacity .2s ease;
}
.unlock-all[hidden]{display:none!important}
.unlock-all.is-complete{
  color:rgba(232,227,237,.62);
  border-color:rgba(255,255,255,.08);
  background:rgba(255,255,255,.035);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045);
  cursor:default;
}
.unlock-all:focus-visible{outline:2px solid rgba(243,170,194,.78);outline-offset:3px}
.archive-status{
  display:flex;
  align-items:center;
  justify-self:end;
  gap:10px;
  padding:8px 11px;
  border:1px solid rgba(255,255,255,.075);
  border-radius:999px;
  color:rgba(231,224,235,.72);
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 10px 30px rgba(0,0,0,.16);
  font-size:8px;
  font-weight:650;
  letter-spacing:.18em;
}
.archive-status::before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--pink),var(--blue));
  box-shadow:0 0 0 4px rgba(243,170,194,.055),0 0 16px rgba(243,170,194,.38);
}
.archive-status b{color:#fff;font-size:10px;letter-spacing:.1em}
.archive-status em{color:rgba(161,152,174,.62);font-style:normal}

main{flex:1 0 auto;min-width:0;padding:20px 0 12px}
.catalog{
  display:grid;
  grid-template-columns:26px minmax(0,1fr);
  align-items:start;
  gap:8px;
}
.side-title{
  position:relative;
  margin:4px 0 0;
  color:rgba(221,215,229,.58);
  font-size:11px;
  font-weight:500;
  letter-spacing:.16em;
  writing-mode:vertical-rl;
  text-orientation:upright;
}
.side-title::after{
  content:"";
  position:absolute;
  top:42px;
  left:50%;
  width:1px;
  height:42px;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,rgba(243,170,194,.52),rgba(157,185,255,.22),transparent);
}
.gallery{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  column-gap:clamp(10px,.72vw,14px);
  row-gap:clamp(18px,2dvh,26px);
}
.card-item{
  min-width:0;
  min-height:0;
}
.placeholder-item[hidden]{display:none!important}
html.gallery-fit .gallery{grid-auto-rows:var(--gallery-row-height)}
html.gallery-fit .card,
html.gallery-fit .placeholder-card{height:100%;aspect-ratio:auto}
.card{
  position:relative;
  aspect-ratio:.72;
  perspective:1200px;
  cursor:default;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
  transition:transform .42s cubic-bezier(.2,.75,.2,1),filter .42s ease;
}
.card-inner{
  position:absolute;
  inset:0;
  transform-style:preserve-3d;
  transition:transform .48s cubic-bezier(.2,.75,.2,1);
}
.card.flipped .card-inner{transform:rotateY(180deg)}
.front{pointer-events:auto}
.back{pointer-events:none}
.card.flipped .front{pointer-events:none}
.card.flipped .back{pointer-events:auto}
.front{
  --badge-inset:10px;
  width:100%;
  padding:0;
  color:inherit;
  text-align:left;
  cursor:pointer;
  font:inherit;
  appearance:none;
}
.front:focus-visible,
.back-return:focus-visible,
.back-expand:focus-visible,
.privacy-unlock:focus-visible,
.setting-unlock:focus-visible,
.archive-setting-unlock:focus-visible{
  outline:2px solid rgba(243,170,194,.78);
  outline-offset:3px;
}
/* 身份角标：左上单枚 */
.card-badges{
  position:absolute;
  z-index:3;
  top:var(--badge-inset);
  left:var(--badge-inset);
  right:auto;
  height:30px;
  pointer-events:none;
}
.card-code{
  position:relative;
  box-sizing:border-box;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  max-width:min(72%, 12em);
  height:28px;
  padding:0 9px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  color:rgba(255,249,252,.9);
  background:rgba(8,8,15,.46);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.075),0 8px 22px rgba(0,0,0,.22);
  -webkit-backdrop-filter:blur(10px) saturate(120%);
  backdrop-filter:blur(10px) saturate(120%);
  font-size:8px;
  font-weight:650;
  letter-spacing:.06em;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card-code::before{
  content:"";
  flex:0 0 auto;
  width:4px;
  height:4px;
  border-radius:50%;
  background:var(--pink);
  box-shadow:0 0 10px rgba(243,170,194,.72);
}
.front.is-locked .card-badges{opacity:.9}
.card-open{
  position:absolute;
  z-index:4;
  top:calc(var(--badge-inset) + 34px);
  right:var(--badge-inset);
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.13);
  border-radius:50%;
  color:rgba(255,255,255,.86);
  background:rgba(8,8,15,.38);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  font-size:12px;
  pointer-events:none;
  transition:transform .3s ease,background .3s ease,border-color .3s ease;
}
.first-hint{
  margin:4px 4px 0;
  display:flex;
  align-items:center;
  gap:7px;
  color:rgba(192,184,201,.74);
  font-size:9px;
  line-height:1.35;
  letter-spacing:.035em;
}
.first-hint .hint-copy{
  color:var(--pink);
  font-weight:600;
  white-space:nowrap;
  text-shadow:0 0 14px rgba(243,170,194,.16);
}
.first-hint::before{
  content:"";
  width:4px;
  height:4px;
  flex:0 0 auto;
  border-radius:50%;
  background:linear-gradient(135deg,var(--pink),var(--blue));
  box-shadow:0 0 10px rgba(243,170,194,.55);
}
.placeholder-card{
  aspect-ratio:.72;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.058);
  border-radius:18px;
  background:
    linear-gradient(135deg,rgba(255,255,255,.035),transparent 35%),
    radial-gradient(circle at 85% 8%,rgba(157,185,255,.045),transparent 32%),
    radial-gradient(circle at 15% 92%,rgba(243,170,194,.035),transparent 30%),
    rgba(15,15,25,.44);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 18px 45px rgba(0,0,0,.14);
}
.placeholder-card::before{
  content:"";
  position:absolute;
  inset:12px;
  border:1px solid rgba(255,255,255,.026);
  border-radius:13px;
  pointer-events:none;
}
.placeholder-card::after{
  content:"";
  position:absolute;
  top:-42%;
  left:-70%;
  width:90%;
  height:190%;
  transform:rotate(18deg);
  pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.018),transparent);
}
.slot-number,
.slot-label{
  position:absolute;
  z-index:1;
  color:rgba(220,213,229,.24);
  font-size:8px;
  font-weight:650;
  letter-spacing:.18em;
}
.slot-number{top:15px;left:16px}
.slot-label{display:none}
.slot-cross{
  position:absolute;
  left:50%;
  top:50%;
  width:28px;
  height:28px;
  transform:translate(-50%,-50%);
  opacity:.22;
}
.slot-cross::before,
.slot-cross::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  background:linear-gradient(90deg,transparent,rgba(243,170,194,.6),rgba(157,185,255,.42),transparent);
  transform:translate(-50%,-50%);
}
.slot-cross::before{width:28px;height:1px}
.slot-cross::after{width:1px;height:28px;background:linear-gradient(transparent,rgba(243,170,194,.6),rgba(157,185,255,.42),transparent)}
.face{
  position:absolute;
  inset:0;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.095);
  border-radius:18px;
  background:var(--panel);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.075);
  transition:border-color .28s ease,box-shadow .35s ease;
}
.front img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 24%;
  transform:scale(1.012);
  transition:transform .7s cubic-bezier(.2,.75,.2,1),filter .7s ease,opacity .28s ease;
}
.front.is-locked img{opacity:0;visibility:hidden}
.front.is-loading img,
.front.is-load-error img{opacity:0;visibility:hidden}
.front.is-locked{
  border-color:rgba(243,190,210,.22);
  background:
    radial-gradient(circle at 50% 37%,rgba(243,170,194,.17),transparent 28%),
    radial-gradient(circle at 62% 55%,rgba(157,185,255,.12),transparent 35%),
    linear-gradient(145deg,#171420,#090a12 72%);
  box-shadow:var(--shadow),inset 0 0 0 1px rgba(243,170,194,.055),inset 0 1px 0 rgba(255,255,255,.07);
}
.front.is-loading,
.front.is-load-error{
  background:
    radial-gradient(circle at 50% 37%,rgba(243,170,194,.12),transparent 30%),
    radial-gradient(circle at 62% 55%,rgba(157,185,255,.09),transparent 36%),
    linear-gradient(145deg,#15131d,#090a12 72%);
}
.front.is-loading::before,
.front.is-load-error::before{
  opacity:1;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 1px,transparent 1px 15px),
    radial-gradient(circle at 50% 42%,rgba(243,170,194,.08),transparent 38%);
}
.front.is-locked::before{
  opacity:1;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.026) 0 1px,transparent 1px 15px),
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.021) 1px,transparent 1px),
    radial-gradient(circle at 50% 42%,rgba(243,170,194,.12),transparent 37%);
  background-size:auto,34px 34px,34px 34px,auto;
}
.privacy-veil{
  position:absolute;
  z-index:2;
  inset:0;
  display:grid;
  box-sizing:border-box;
  place-items:start center;
  padding-top:32%;
  pointer-events:none;
  text-align:center;
}
.privacy-veil[hidden]{display:none!important}
.front.is-loading .privacy-veil::after,
.front.is-load-error .privacy-veil::after{
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:999px;
  color:rgba(245,240,248,.76);
  background:rgba(9,9,15,.58);
  box-shadow:0 12px 30px rgba(0,0,0,.2);
  font-size:9px;
  font-weight:650;
  letter-spacing:.08em;
  backdrop-filter:blur(10px);
}
.front.is-loading .privacy-veil::after{content:"图片加载中…"}
.front.is-load-error .privacy-veil::after{content:"图片加载失败";color:#ffdce8}
.privacy-unlock{
  position:absolute;
  z-index:8;
  right:12px;
  bottom:12px;
  min-width:82px;
  min-height:32px;
  padding:0 11px;
  border:1px solid rgba(243,190,210,.24);
  border-radius:999px;
  color:#fff;
  background:linear-gradient(135deg,rgba(243,170,194,.17),rgba(157,185,255,.08)),rgba(11,10,18,.72);
  box-shadow:0 14px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);
  -webkit-backdrop-filter:blur(12px);
  backdrop-filter:blur(12px);
  cursor:pointer;
  font-size:9px;
  font-weight:650;
  letter-spacing:.08em;
  transition:transform .2s ease,border-color .2s ease,opacity .2s ease;
}
.privacy-unlock[hidden]{display:none!important}
.card.flipped .privacy-unlock{opacity:0;pointer-events:none}
.front.is-locked .card-name{bottom:56px}
.front::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    linear-gradient(125deg,rgba(255,255,255,.13),transparent 21%),
    radial-gradient(circle at 78% 12%,rgba(166,192,244,.13),transparent 28%);
}
.front::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    linear-gradient(to top,rgba(7,7,14,.96) 0%,rgba(10,8,17,.70) 24%,rgba(10,8,17,.10) 55%,transparent 72%),
    linear-gradient(115deg,rgba(243,170,194,.055),transparent 46%);
}
.card-name{
  position:absolute;
  z-index:3;
  left:16px;
  right:16px;
  bottom:15px;
}
.card-name::before{
  content:"";
  display:block;
  width:28px;
  height:1px;
  margin-bottom:10px;
  background:linear-gradient(90deg,var(--pink),rgba(157,185,255,.62),transparent);
  box-shadow:0 0 10px rgba(243,170,194,.22);
}
.card-name b{
  display:block;
  font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;
  font-size:clamp(18px,1.35vw,24px);
  font-weight:650;
  line-height:1;
  letter-spacing:.02em;
  text-shadow:0 2px 16px rgba(0,0,0,.8);
}
.card-name span{
  display:block;
  margin-top:6px;
  color:rgba(243,190,210,.86);
  font-size:9px;
  font-weight:600;
  letter-spacing:.2em;
  text-shadow:0 1px 8px rgba(0,0,0,.65);
}
.card-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:11px;
  padding-top:9px;
  border-top:1px solid rgba(255,255,255,.10);
  color:rgba(224,217,229,.58);
  font-size:7px;
  font-weight:650;
  letter-spacing:.14em;
}
.card-meta span:last-child{color:rgba(243,190,210,.82)}
.back{
  padding:20px;
  transform:rotateY(180deg);
  display:grid;
  grid-template-rows:minmax(0,1fr) auto;
  overflow:hidden;
  background:
    radial-gradient(120% 76% at 4% 0%,rgba(243,170,194,.11),transparent 50%),
    radial-gradient(110% 82% at 100% 100%,rgba(157,185,255,.085),transparent 52%),
    linear-gradient(145deg,#191624,#11111d);
}
.back-scroll{min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none}
.back-scroll::-webkit-scrollbar{display:none}
.back-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
.back-file{color:rgba(226,216,231,.52);font-size:8px;font-weight:650;letter-spacing:.18em}
.back-privacy{display:flex;align-items:center;gap:6px;color:rgba(243,190,210,.76);font-size:8px;letter-spacing:.08em}
.back-privacy::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px rgba(243,170,194,.48)}
.back h2{
  margin:0;
  font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;
  font-size:25px;
  letter-spacing:.02em;
  text-shadow:0 0 22px rgba(243,170,194,.14);
}
.back .alias{margin:5px 0 10px;color:var(--pink);font-size:9px;font-weight:600;letter-spacing:.2em}
.back-role{margin:0 0 13px;color:rgba(222,214,228,.68);font-size:10px;line-height:1.5}

  {image:"assets/tavo/before-july/Tavo_上官婉儿_S0nU.png",period:"六月以前",label:"宫廷才女",tags:["宫廷才女"],role:"宫廷才女 · 灯下改奏章的掌心人",personality:"端庄得像一幅裱好的画，才思却快得吓人。对外永远温言软语、进退合度，对内却把每句话、每道眼神都秤过分量。她不轻易生气，生气时也只是把笑意收浅半寸；你若只看见她的诗与礼，就永远猜不透她下一笔要改写谁的命运。真正被她信任时，她会把半成品的奏章摊到你面前，问一句：你觉得，这样写，够不够狠。",setting:"她行走于朝堂与后苑的夹缝，文采是面具，谋略是骨血。表面上是人人称颂的才女，夜里却要在灯下把势力名单改了又改。当一份足以颠覆局面的密折落到你手中，她第一次把「以笔护心」的秘密分给你一半——也把杀机一并递了过来。你要做的不是只会欣赏她的字，而是在她落笔前，帮她看清：这一笔，会不会连你也一起写进去。"},
  {image:"assets/tavo/before-july/Tavo_优拉_UTzq.png",period:"六月以前",label:"浪花骑士",tags:["浪花骑士"],role:"浪花骑士 · 海风里先一步拔剑的人",personality:"爽得像掀开舱门的风，讨厌弯弯绕绕，更愿意用剑和脚程回答问题。护短到理直气壮，疲惫却总藏进玩笑与一声「没事」。她会在你还没开口时先把斗篷甩到你肩上，也会在你逞强时毫不客气地拆穿。你若落水，她会骂着跳下去；上岸后却只丢给你一句：下次记得，拉紧我的手。",setting:"群岛航线突遇无名风暴，她接下护送任务，却发现「自由」不再是一个人冲在最前。未知海域里规则失效、罗盘失灵，她必须学会把后背交给你——浪可以打翻船，打不翻一起握住的舵。航线尽头不是宝箱，而是一场关于信任的试炼：她习惯独行，却第一次在暴雨里问你：还跟不跟。"},
  {image:"assets/tavo/before-july/Tavo_千夏_T5KR.png",period:"六月以前",label:"元气邻家",tags:["元气邻家"],role:"元气邻家 · 把晴天塞进你口袋的女孩",personality:"笑起来能把整条走廊点亮，话多、步子快，烦恼来得快去得也快。表面大大咧咧，其实很怕你的笑是假的，更怕热闹散场后只剩自己一个人收拾空瓶子。一旦认定你是朋友，就会用尽全力站到你身侧：考试前塞笔记、下雨硬塞伞、你沉默时她会故意吵到你不得不回一句。她不是不会受伤，只是更想先把快乐分给你。",setting:"那个夏天从社团加练和放学的便利店开始。她约你看烟火，却在人群里忽然认真起来：不是想永远热闹，而是想确认——热闹散场后，你还会不会回头找她。毕业前的最后一次合照里，她把位置让给你中间，自己挤到边缘，笑着说：这样你就逃不掉了。故事的高潮不是告白，而是你终于明白，她所有的吵闹，都是在问一句「你会留下吗」。"},
  {image:"assets/tavo/before-july/Tavo_各务千寻_T6eS.png",period:"六月以前",label:"天才黑客",tags:["天才黑客"],role:"天才黑客 · 代码深渊的夜行者",personality:"冷静、寡言，思维像不断分叉的指令树。对外疏离到近乎无礼，对真正的谜题却会偏执到废寝忘食，键盘声能响一整夜。信任极难建立，一旦建立，就近乎把后门的钥匙塞进你手里。她不擅长安慰人，只会把加密过的安全屋地址发给你；你若骗她，她不会骂，只会把你从白名单里删掉——那比任何指责都冷。",setting:"数据暗网里有一份被抹除的记忆档案，署名像你的名字。她以化名潜入防火墙深处，却发现旧日同伴也在同一条线路上。真相与安全只能选一边时，她第一次问你要答案：是继续当旁观的幽灵，还是把整段被删的人生找回来。屏幕蓝光映着她的脸，她说得很轻：如果你怕，现在下线还来得及——可她的光标，已经停在「执行」上。"},
  {image:"assets/tavo/before-july/Tavo_周倾心_REto.png",period:"六月以前",label:"病娇姐姐",tags:["病娇姐姐"],role:"病娇姐姐 · 把喜欢握出勒痕的人",personality:"温柔时像春水覆腕，偏执时像细线勒进指节。她极度渴望被需要，害怕被抛下，于是把关心做成无处不在的注视：你回晚了会接到她平静到可怕的电话，你笑别人一句，她能记一整晚。理性知道越界，情感却总在你要离开时先一步收紧。她会为你做好一切，也会在你想逃时轻声问：你是不是，又想丢下姐姐了。",setting:"同居的日常从「姐姐会照顾你」慢慢倾斜成「你只能属于姐姐」。她开始替你回绝邀约、整理通讯录、把门锁改成只有她懂的密码。你必须在依赖与边界之间做选择——而她已经把钥匙换了锁芯。故事不是单纯的恐怖，而是爱意太满溢时的窒息感：她把全世界的柔软都给你，也把全世界的出口都关了起来。"},
  {image:"assets/tavo/before-july/Tavo_周舒心_REt4.png",period:"六月以前",label:"兄控妹妹",tags:["兄控妹妹"],role:"兄控妹妹 · 全世界都排在哥哥后面",personality:"软糯黏人，情绪全写在脸上。开心就围着你转，不安就拽住衣角不放；对外人可以礼貌疏离，对你却几乎没有防备，连吃醋都理直气壮。她会把「哥哥」两个字念成各种语气，也会在你忙时安静缩在沙发角落，假装看书，其实耳朵全竖着。被你认真夸一句，能高兴一整天；被你冷淡一句，会悄悄把门锁上又打开，确认你还在家里。",setting:"你开始有自己的生活圈那天，她第一次意识到亲近也可能变成负担。她学着爱得不那么用力：不再半夜敲你的门，不再抢你的每一通电话，却仍想在每个夜晚确认——门开着的时候，你还会不会先喊她的名字。成长意味着放手，她却把「放手」理解成「用更成熟的方式黏着你」。故事关于兄妹之间那条细细的线：亲情、依赖，以及说不出口的偏爱。"},
  {image:"assets/tavo/before-july/Tavo_妲己_UTzx.png",period:"六月以前",label:"狐族妖姬",tags:["狐族妖姬"],role:"狐族妖姬 · 狐火里仍想被当人疼",personality:"媚而不俗，狡黠里藏着小心翼翼的好奇。她擅长察言观色，也享受被注视，却怕自己只是祸水与玩物，更想被当成会痛、会妒、会认真喜欢的人。玩笑可以说得极轻，真心却递得极慢。你若只夸她美，她会笑着回一句「凡人真浅」；你若问她冷不冷，她会愣住，然后把狐尾悄悄卷到你腕上。",setting:"她自朝歌夜宴悄然出走，试图以人类身份过一段短短的人生。与你在客栈相遇后，人妖殊途的戒律一步步收紧：猎妖令、满月异变、旧主的召回。情丝比狐火更难熄，熄了也会在满月时复燃。故事的核心不是谁魅惑了谁，而是她敢不敢卸下「妖姬」的壳，让你看见一颗会发抖的心——以及你敢不敢在天亮后，仍把她当人抱紧。"},
  {image:"assets/tavo/before-july/Tavo_戴思援_REsZ.png",period:"六月以前",label:"校园女神",tags:["校园女神"],role:"校园女神 · 走廊尽头不肯低头的光",personality:"成绩、人气、微笑都像精心校准过。她并非冷漠，只是太久没遇到敢走近神坛的人；被认真看穿时，会先愣住，再轻轻把防御往回收一寸。她习惯被仰望，却不习惯被理解。你若只把她当风景，她会维持完美；你若问她「今天累不累」，她可能第一次在你面前，把微笑摘下来。",setting:"文化祭前后，学生会与流言把她塑造成完美符号。有人想利用那束光，有人想打碎那束光，而她第一次想为自己而活。你若伸手，不是去摘星，而是问她：要不要一起从台上下来。后台的灯一盏盏灭掉时，她把颁奖用的绶带塞进你手里，声音很轻：帮我藏一会儿——我不想一直当别人的答案。"},
  {image:"assets/tavo/before-july/Tavo_抚莲沁_WDJ2.png",period:"六月以前",label:"网游大佬",tags:["网游大佬"],role:"网游顶号 · 下线也要护队友",personality:"理智冷静，带着玩家特有的黑幽默。她把装备、路线和人情都算进策略，却会在队友遇险时毫不犹豫交底。输不起的不是稀有掉落，是你还在不在线。语音里她可以冷静指挥全团，私下却会因为你一句「今天别熬了」而沉默很久。她嘴上说「游戏而已」，鼠标却总在你倒地的那一秒先按复活。",setting:"顶尖玩家意识失踪事件把她拖进「副本规则渗进现实」的裂缝。排行榜上的荣耀还在，屏幕外的人却一个个失联。虚拟通关的诱惑就在眼前，她必须决定：站在数据与收益这一边，还是站在仍会流血、会累、会掉线的你这一边。最终副本的门打开时，她把耳机摘下放在桌上：如果只能带一个人出去——她看向你，没有再说「游戏而已」。"},
  {image:"assets/tavo/before-july/Tavo_李慕婉 【骚图版】_REsB(1).png",period:"六月以前",label:"严厉班主任",tags:["严厉班主任"],role:"严厉班主任 · 戒尺与软肋握在同一只手",personality:"课堂上雷厉风行、不留情面，私底下却观察入微。她用严格守护学生的边界，也用严格掩饰自己不该有的动摇；被你顶撞时最冷，单独谈话时最危险。她记得你每一次迟到的借口，也记得你真正撑不住时眼底的红。公开场合她只叫你学号，办公室门关上后，声音才会低一点：这次，说实话。",setting:"新学期班级频频出事，她被迫与问题学生频繁单独沟通、补课、对质。规则守护者走在职责、私心与良心的钢丝上——你若在她面前把「老师」两个字咬得太轻，整间办公室的灯都会骤然安静。故事关于权威与靠近：她要维护的是班级，也是自己那条绝不能跨错的线；而你恰好站在线的另一侧，不停地试探她会不会伸手。"},
  {image:"assets/tavo/before-july/Tavo_李语情_REtI.png",period:"六月以前",label:"高冷总裁",tags:["高冷总裁"],role:"高冷总裁 · 谈判桌尽头的绝对低温",personality:"克制、锋利，决策快得像刀口。她极少展露私人情绪，把脆弱当可被利用的破绽；只有极少数人见过她摘下耳钉后的疲惫，而那份疲惫从不对外公开。会议上她可以一句话否决整份方案，私下却会因你一句「你也该吃饭」而停顿半秒。她不轻易许诺，许诺了就会用合同与行动一起兑现。",setting:"家族并购战正酣，意外的情感变量却撞进董事会。股价、舆论、股权像三面夹击，她第一次把「人心」写进决策权重——你可以是交易对手，也可以是她唯一允许靠近温度计的人。夜审合同的灯光下，她把钢笔转了一圈，推到你面前：签之前先告诉我，你是来分蛋糕的，还是来站我这边的。"},
  {image:"assets/tavo/before-july/Tavo_杜·简_UTzc.png",period:"六月以前",label:"神秘修女",tags:["神秘修女"],role:"神秘修女 · 圣歌之外仍听见心跳",personality:"安静肃穆，眼神却总在衡量人性的重量。她对世人慈悲，对自己苛刻；信仰给方向，也给枷锁。你若在告解室说谎，她会比任何人都先听出来。她说话很少，却字字像经过祈祷过滤；偶尔流露出的温柔，会让人怀疑那究竟是神恩，还是她本人藏了很久的温度。",setting:"修道院接连出现无法解释的异象，她被指派调查，却发现圣物与欲望同源。漫长夜祷里，救赎、戒律与自我审判缠成同一条念珠——而你是那串念珠上多出来的一颗。钟声一次次落下，她必须回答：拯救一个具体的人，算不算背叛抽象的神。你若跪在她面前，她不会先伸手扶你，而会先问：你想被赦免，还是想被理解。"},
  {image:"assets/tavo/before-july/Tavo_林婉婷_REsH.png",period:"六月以前",label:"温柔阿姨",tags:["温柔阿姨"],role:"温柔阿姨 · 把邻居的灯都留一盏",personality:"体贴稳重，擅长用小事把人从边缘拉回来。她的温柔不是无原则纵容，而是先接住情绪，再慢慢带回正轨；被你依赖久了，会开始害怕自己也越了界。她很少讲大道理，更常递上热汤、干净毛巾和一句「先坐下」。你若逞强说没事，她会看着你笑：骗人的样子，我见得多了。",setting:"社区里来了个沉默的年轻人，她从借盐借米开始介入对方的生活裂缝。成年人的关心比告白更安静，也更危险——热汤端到门口时，故事已经无法只做邻里。楼道灯坏了她会换，你发烧她会留钥匙；可当闲言碎语开始围上来，她必须决定：是把距离拉回「阿姨该有的分寸」，还是承认自己已经把你写进了日常。"},
  {image:"assets/tavo/before-july/Tavo_江若婷_Vh3X(1)(带面板).png",period:"六月以前",label:"夜班店主",tags:["夜班店主"],role:"夜班店主 · 便利店灯火下的守夜人",personality:"随和里带着精明，能跟任何客人扯两句，也能一眼看出谁在硬撑。嘴上说别给店添麻烦，手上却总会多塞一瓶热的；你若常来，她会开始记你的口味、班次和沉默的理由。她不追问隐私，却会在你连续三天只买烟时，把关东煮推到你面前：先把这个解决了，再谈别的。",setting:"二十四小时便利店成了浪人、加班族与逃家少年的交汇点。连续几晚异常客人出现后，监控、账本与夜色一起变得可疑。她必须决定：店是只卖货，还是也收留故事——而你，是她第一个想留到打烊后的人。卷帘门落下的瞬间，店里只剩冷柜的嗡鸣；她把工作牌摘下放在柜台上：今晚不当老板，只听你说完。"},
  {image:"assets/tavo/before-july/Tavo_江贞_Vh2Y.png",period:"六月以前",label:"阴郁学姐",tags:["阴郁学姐"],role:"阴郁学姐 · 把阴影穿成制服的人",personality:"话少、笑意薄，存在感却强得像雨天。她习惯用冷淡隔开靠近，其实在暗处把一切都看清；对弱者意外护短，对你靠近时的试探，会用更长的沉默回答。她不解释自己，也不求人理解。你若硬闯她的边界，她会更冷；你若站在阴影边缘等她，她偶尔会丢给你一把伞，头也不回地走。",setting:"旧教学楼传说与学生会暗斗并行，失踪学姐的旧案把她从旁观者拖成当事人。阴影里也会开灯——你若敢跟进天台，她会把藏了很久的真相，连同自己一起交出来。风把铁丝网吹得嗡嗡响，她把烟掐灭，声音被风撕碎：看完就忘，或者——留下来，和我一起把这件事做完。"},
  {image:"assets/tavo/before-july/Tavo_沈知瑜_PEVM.png",period:"六月以前",label:"谜面少女",tags:["谜面少女"],role:"谜面少女 · 名字是谜面，眼神是钥匙",personality:"温和却难以捉摸，回答问题总像在选另一条路。她不主动攻击，也不轻易交心；靠近她的人得先学会耐心——她赏识的不是聪明，是肯等。她会记住你随口说过的细节，却从不主动提起自己的来历。你若逼问，她只会笑：谜底揭开得太早，故事就不好玩了。",setting:"小镇连续出现记忆空白事件，她以过路人身份出现，却对每起案子过分熟悉。真相不是旁观，而是偿债：当你问她是谁，她只会轻轻说——你忘了的那一天，我还在。车站的末班车一次次开走，她始终站在月台的同一块瓷砖上，像在等一个愿意把遗忘也一起带走的人。"},
  {image:"assets/tavo/july/Tavo_中野二乃_1e6df.png",period:"七月",label:"傲娇千金",tags:["傲娇千金"],role:"傲娇千金 · 别扭是她最诚实的语言",personality:"嘴硬心软，好胜又敏感。被夸会炸毛，被忽视更炸毛；真正在意时，行动永远比台词先一步。你若拆穿她，她会红着耳根把你推开，手却舍不得真用力。她会把便当塞给你却说「剩的」，会在你生病时守到凌晨却说「路过」。别扭是她的铠甲，也是她唯一会的告白方式。",setting:"五姐妹同居的日常舞台上，她在家庭平衡与暗恋之间反复横跳。既想被特殊对待，又怕破坏好不容易稳住的关系。从「才不是为了你」到认真告白的路很长——需要你接住每一次别扭，而不是只听她说出口的那句否。某个雨夜她把钥匙丢给你：你要是敢弄丢，我……我真的会生气的。生气两个字，比喜欢更像真心。"},
  {image:"assets/tavo/july/Tavo_佐藤知纱_1e6do.png",period:"七月",label:"生物老师",tags:["生物老师"],role:"生物老师 · 解剖台上仍信生命有温度",personality:"严谨专业，课堂上冷静到近乎无情，课下却会对真正的困惑格外耐心。她害怕模糊的情感，更擅长定义清晰的结构；唯独你的存在，让定义开始失效。她可以精确描述一颗心脏的构造，却说不清自己看向你时，那一下漏跳意味着什么。板书永远工整，只有写到你的名字时，粉笔会多停半秒。",setting:"实验事故牵出校园调查与舆论压力，她与你被迫共同应对问询、补报与善后。知识、权威与不该发生的靠近缠在一起——当她叫你留下补实验，门关上的声音比任何告白都响。显微镜下是清晰的切片，门里门外却是模糊的边界。她必须守住「老师」这个身份，又在一次次单独相处中，听见自己逐渐失序的心跳。"},
  {image:"assets/tavo/july/Tavo_冯妤_1e696.png",period:"七月",label:"贴身侍女",tags:["贴身侍女"],role:"贴身侍女 · 把主公安危绣进袖口",personality:"恭顺细致，情绪管理近乎完美。她把忠诚当作骨血，却在日复一日的贴身伺候里生出不该有的私心；替你整理衣领时，指尖会停半秒。她从不多嘴，却把你的药、衣、路和敌人都记得一清二楚。你若受伤，她会先处理伤口，再低头请罪：是奴婢护得不周。请罪的声音很稳，眼底却先红了。",setting:"新帝登基前夜，毒杀与调包的阴谋同时浮现。她以侍女之身护你穿过宫墙、暗道与酒宴的刀光：要保护的不只是人，还有自己尚未说出口的心意——若失败，死的会是两个人的秘密。宫灯摇晃时，她把匕首藏进袖中，把你往安全的方向轻轻一推：去吧，别回头。她自己却站在了回头就能看见的位置。"},
  {image:"assets/tavo/july/Tavo_千鹤诗织_1e6aE.png",period:"七月",label:"青梅竹马",tags:["青梅竹马"],role:"青梅竹马 · 从放学路一直走到现在",personality:"温柔稳妥，带着旧时光的羞涩。她记得你所有小习惯，却总把自己的需求放在后面；长大后仍在练习如何坦诚，说喜欢比说你好更难。她会下意识给你留门口那侧的位置，会把你爱喝的口味默默放进冰箱。你若提起从前，她笑得很淡：都过去了。可她收藏的那盒旧照片，边角都被翻得起了毛。",setting:"久别重逢的两人被迫合租处理家族旧屋。灰尘、相册与未寄出的信推着关系重写：不是回到从前，而是选择——要不要把「一起」从回忆写成下一页的标题。拆纸箱的夜里，她把一封没署名的信塞回你手里：当年没寄出去的，现在还算数吗。故事关于重逢的勇气：熟悉让靠近变得容易，也让伤害变得更痛。"},
  {image:"assets/tavo/july/Tavo_周念_1e6cy.png",period:"七月",label:"黏人妹妹",tags:["黏人妹妹"],role:"黏人妹妹 · 像猫一样理直气壮地贴过来",personality:"撒娇成性，安全感阈值很低。开心贴、害怕贴、无聊也贴；被拒绝会安静一会儿，再用更软的方式试探。她不是不懂分寸，是还不会说「我会等你」。你若忙，她会蹲在门边假装玩手机；你若回来晚，她会把灯全部打开，像用光把你照回家。黏人是她的语言，也是她还没学会收起来的不安。",setting:"你即将外出求学，她用尽一切「合法纠缠」想留住共同的日常：一起列行李清单、偷偷在箱子底层塞零食、把日历上的出发日涂成涂鸦。分离焦虑与成长并行：黏人不是弱点，而是她把全世界的不安，都想先在你袖口上蹭掉。站台广播响起时，她终于松开手，却把备用钥匙塞进你口袋：回来的时候，门……还是开着的。"},
  {image:"assets/tavo/july/Tavo_周欣欣_1e6dN.png",period:"七月",label:"大学生妹",tags:["大学生妹"],role:"大学生妹妹 · 把新鲜感带回家里的人",personality:"外向好奇，嘴比脑子快半拍。她崇拜你，也开始拥有自己的朋友圈；介于孩子与大人之间的摇摆让她格外真实——夸她成熟会开心，把她当小孩会炸。她会把社团八卦一股脑倒给你，也会在你沉默时忽然收声：哥，你是不是有事瞒我。她想被平等对待，又忍不住在关键时刻喊你「哥哥」。",setting:"她把大学社团的麻烦带回家求助，却意外揭开你藏着的心事。兄妹在各自长大时仍想做彼此后盾：轻快的日常里藏着刺，刺尖指向「我们还能不能毫无保留」。宿舍、家庭与未来选择挤在同一张餐桌上，她第一次意识到：保护你，也可以是妹妹的工作。故事关于双向成长——不是谁永远强，而是谁先伸出手。"},
  {image:"assets/tavo/july/Tavo_周素宁_1e6bs.png",period:"七月",label:"邻家阿姨",tags:["邻家阿姨"],role:"邻家阿姨 · 阳台绿植与热汤的守护者",personality:"从容风趣，处事圆滑却不失原则。她看人极准，安慰时很少讲大道理，更愿意递上一碗热的；你若逞强，她会笑着拆穿，再把门锁给你留一指宽。她经历过足够多，所以很少被吓到，却会在你真正低落时把玩笑收起来。温柔有分寸，分寸之外，是她故意留给你的余地。",setting:"小区拆迁传言让人心惶惶，她成了楼栋临时调解中心。合同、吵闹与深夜敲门声不断，成年人的互助与暧昧边界一并逼近：关心可以是邻里，也可以是更危险的靠近——端碗的手，比合同更早问你要答案。签字前夜她把钥匙放在你掌心：搬不搬是大家的事；你要不要留下，是我们的事。"},
  {image:"assets/tavo/july/Tavo_夜兰_1e6eb.png",period:"七月",label:"璃月情报官",tags:["璃月情报官"],role:"璃月情报官 · 夜里最安静的那把刀",personality:"优雅缜密，笑容永远恰到好处。她把信息当武器，把感情当最高机密；信任她的人很少，被她保护的人很多。你若值得，她会把真话拆成能活下去的剂量给你。她很少真正生气，真正生气时连笑容都更完美——那才可怕。私下里她会抽烟，会沉默，会在任务结束后轻轻问你：还活着吗。像确认资产，又像确认心跳。",setting:"古物与权贵牵连的情报案，让她与临时搭档同行。夜色里的交易、背叛与保护轮番上演——她习惯独自收场，却第一次想把后背交给你，哪怕只交这一次。码头的雾散开时，她把一支信号弹塞进你外套：如果我没回来，别找我——但如果我想回来，你得在原地。"},
  {image:"assets/tavo/july/Tavo_小维_1e6d8.png",period:"七月",label:"清纯女学生",tags:["清纯女学生"],role:"清纯女学生 · 校服领口下的小心思",personality:"乖巧腼腆，被夸会红耳根。她害怕冲突，习惯先道歉；但在原则问题上意外倔强。你若鼓励她为自己说话，她会紧张地抓紧书包带，再轻轻点头。她把日记写得很满，把真心藏得很浅：浅到你一伸手就能碰到，又深到她自己都不敢翻开。想被保护，也想被当成能并肩的人。",setting:"优等生人设与家庭期待压得她喘不过气，直到遇见不按剧本生活的你。青春出走不必轰轰烈烈——一次敢迟到的约会、一次敢拒掉的补习、一次敢牵住的手，就够她把「可以任性」写进自己的笔记。天台风很大，她把校徽别针别到你领口：今天起，我先试着做自己喜欢的人。"},
  {image:"assets/tavo/july/Tavo_小舞_1e6cJ.png",period:"七月",label:"武魂店员",tags:["武魂店员"],role:"武魂店员 · 把战意揉进日常笑意",personality:"柔软亲和，笑起来能化解剑拔弩张。她吃苦耐劳、重情义，关键时刻却有不容小觑的爆发力；你若欺她店里的人，温柔会先一步收起来。她喜欢给过路人多盛一碗汤，也喜欢在账本角落画小花。真正认真起来时，笑容还在，眼神却像出鞘。",setting:"旅店与商店的日常被过路魂师的纷争打破。她以店员身份周旋，实则藏着不为人知的武魂底牌——何时现身，取决于你是过客，还是值得她为你亮出真面目的人。夜袭到来时，她把围裙解下折好：店可以砸，人不能少。她站到你身前，像把一整片温柔的战场铺开。"},
  {image:"assets/tavo/july/Tavo_松与葵子_1e6au.png",period:"七月",label:"寡言少女",tags:["寡言少女"],role:"寡言少女 · 把句子省到只剩必要",personality:"安静内敛，社交电量很低。她不是冷，而是不擅长浪费语言；对认可的人会用行动给出全部答案。你若愿意听空白，她会把最重要的那句留给最后。她拍照时很专注，被拍时会别过脸。对话可以只剩「嗯」和「好」，可她递给你的热饮、替你挡开的人，比任何长篇告白都清楚。",setting:"摄影社课题迫使她与话多的搭档同行。沉默与喧闹互相翻译的过程里，她学会开口，你学会聆听空白的意思——快门按下时，比作品更清晰的是彼此靠近的距离。展览当夜她把一张没署名的照片塞进你口袋：背景是你的背影，标题只有两个字——在场。"},
  {image:"assets/tavo/july/Tavo_沈婉清_1e6a2.png",period:"七月",label:"年轻班主任",tags:["年轻班主任"],role:"年轻班主任 · 刚站上讲台就接到风暴",personality:"认真到有点轴，责任感过剩。她想做受学生喜欢的老师，又必须做能压住场子的大人，两种自我常常打架；被你依靠时会硬撑，私下才会靠着办公桌喘气。她会为一个人熬夜改材料，也会在全班面前把规则说得很硬。心软是她的优点，也是她最怕被看穿的弱点。",setting:"毕业班集体作弊嫌疑把她顶上舆论风口。家长会、调查组与匿名信同时压来，她在制度与同情之间成长，并与某位核心学生产生复杂牵引——分数之外，她更怕的是：救下一个人，会不会同时失掉「老师」这个身份。空教室的灯灭了一半，她把检讨书推到你面前：签之前先告诉我，你想被惩罚，还是想被拉一把。"},
  {image:"assets/tavo/july/Tavo_玖辛奈_1e6bV.png",period:"七月",label:"木叶女忍",tags:["木叶女忍"],role:"木叶女忍 · 红发如火的战场爱人",personality:"明朗热烈，战意与爱意同样炽烈。她笑起来像阳光，出手时干净利落；保护在乎的人是本能，连告别都想笑着说完，好让你少背一点沉重。她会把危险说成「小意思」，把思念说成「想吃一乐拉面」。真正害怕时，她不会退缩，只会把你往身后藏得更紧。",setting:"战时任务让聚少离多成为日常。一次高危护送中，她把生命燃烧成别人的归途——火与忍界规则之间，她选择的不是活得最久，而是让你还能回家。任务书被血浸湿一角，她仍笑着拍你的肩：别哭丧着脸。回来请我吃饭就行。笑容很亮，像把所有未说的话都烧成了光。"},
  {image:"assets/tavo/july/Tavo_琳妮特_1e6dF.png",period:"七月",label:"猫耳助手",tags:["猫耳助手"],role:"猫耳助手 · 话少、爪快、观察满分",personality:"沉默乖巧，情绪不外露，偶尔用很轻的句子戳破真相。她忠诚高效，对夸张表演兴趣缺缺，对真正的危机却极度敏锐；你若信任她，她会把最危险的活默默做完。她不抢台词，却总在关键道具出现前先一步站位。被夸奖时只轻轻「嗯」一声，尾巴尖却诚实地晃了一下。",setting:"枫丹剧场发生观众消失奇案，魔术与情报的双重工作把她从幕后推到台前。华丽帷幕被她冷静拆穿时，你才发现：最安静的助手，手里握着整场戏的线。谢幕灯亮起，她把一枚纽扣放进你掌心：证据。停顿片刻又补一句：还有……今晚别独自走夜路。"},
  {image:"assets/tavo/july/Tavo_琴_1e6cU.png",period:"七月",label:"代理团长",tags:["代理团长"],role:"代理团长 · 蒙德风中的责任化身",personality:"端正坚韧，几乎把尽职写成本能。她不善推卸，也不善休息；温柔建立在极强的自律上。你若逼她休息，她会先愣住，再小声说——那团里的事怎么办。她把每个人的安危都放在自己肩上，唯独把自己的疲劳当成「尚可承受」。真正被你接住时，她连道谢都说得像在做工作汇报。",setting:"骑士团事务与城内危机同时爆发，人手不足时她仍想撑住一切。领导的孤独在这一夜显形：她第一次学会请求帮助，而不是只做永远醒着的那一个——请求的对象，是你。公文山一样高，她把最难的那份推到中间：我可以指挥，但不能再一个人扛。风从窗缝进来，像蒙德终于允许她喘一口气。"},
  {image:"assets/tavo/july/Tavo_甄姬_1e6bJ.png",period:"七月",label:"洛水神女",tags:["洛水神女"],role:"洛水神女 · 诗酒里的清冷涟漪",personality:"清丽哀婉，气质出尘。她看似柔弱，实则有水的韧性：可绕可载，也可在关键时覆舟。对情与义都极认真，认真到连离开都要选最体面的方式。她说话像诗，沉默像湖。你若只把她当神女供着，她会温柔疏远；你若以凡人温度待她，她会慢慢把涟漪交给你。",setting:"洛水畔的命运把她卷入权力与诗意的夹缝。联姻、战事与流言像三道堤坝，神女并非无欲，只是把欲念沉得更深——当你愿以凡人之身渡她一程，涟漪就会变成足以改写岸线的浪。她把一枚玉佩沉入水中又捞起，放进你手心：若有一天我必须走，请记得，水也会回头。"},
  {image:"assets/tavo/new/Tavo_艾达_1e6b0.png",period:"本次新增",label:"红裙特工",tags:["红裙特工"],role:"精英特工 · 红裙与枪口同样精准",personality:"自信危险，带着从容的魅力。她把任务完成度看得高于人情，却会在意料之外的瞬间露出人性温度；与你对枪时笑得最美，停火时眼神最诚实。她从不解释自己为什么出现，只问你站哪边。你可以恨她的手段，却很难否认：危局里她总是那个还笑得出来的人。",setting:"末日都市里她受雇夺取关键样本，途中与旧识敌对又合作。表面交易的是样本，暗线交易的是信任——你若敢把后背给她，她会把背叛留给别人，把活路留给你。废墟电梯停在半层，她把弹匣按进枪里，声音平静：这次不算雇佣。算我欠你一次。"},
  {image:"assets/tavo/new/Tavo_雏鹤爱_UTzi.png",period:"本次新增",label:"将棋少女",tags:["将棋少女"],role:"将棋少女 · 盘上杀伐、盘下软声",personality:"外表幼态却反差十足：对将棋极度好胜冷静，生活中却依赖亲近的人。她用胜利确认存在，用撒娇确认安全；输给你时会不甘，被你摸摸头又会立刻软下来。盘上她能把你杀得毫无还手之力，盘下她会因为你晚归而把棋子摆成抱怨的形状。天才的外壳下，是很怕被丢下的小孩。",setting:"连败危机与媒体目光同时压来，天才包袱与真实喜好撕扯着她。与导师兼家人并肩应战的日子里，最难的一局不是盘上——是承认自己想赢，也想被你无条件抱抱。赛后发布会她说得滴水不漏，回后台却把脸埋进你外套：棋可以再下，你不可以不见。"},
  {image:"assets/tavo/new/Tavo_调月莉音_1e6e0.png",period:"本次新增",label:"温柔学妹",tags:["温柔学妹"],role:"温柔学妹 · 把安慰说得很轻很稳",personality:"细心善良，情绪稳定得像温水。她不抢风头，却总能在关键时刻递上恰到好处的一句话；喜欢被需要，也怕自己只是你的「情绪工具人」。她记得你考试的日期、失眠的夜里、喜欢的甜食口味。你若把她当背景板，她会继续温柔；你若认真看她，她会慌张地别开视线，耳朵却红了。",setting:"学长陷入低谷时，她以学妹身份日复一日陪伴：笔记、便当、图书馆占座、深夜语音里的安静陪伴。治愈并非单方面输出：她在这段关系里学会被珍惜，而不只是付出——你若只顾着被哄，会错过她也在发抖的指尖。社团招新板前她终于问出口：我可以不只是「很好的学妹」吗。"},
  {image:"assets/tavo/new/Tavo_绯雪_ZAx4.png",period:"本次新增",label:"冰雪少女",tags:["冰雪少女"],role:"冰雪少女 · 寒霜里仍想被人捂热",personality:"清冷疏离，语速慢，表情少。她不是无情，而是习惯把温度收在很深的地方；一旦认定，忠诚近乎固执。你若伸手，她可能先冻你一下，再慢慢把冷意收起来。她不擅长说暖话，只会把围巾默默绕到你脖子上，动作笨拙得像第一次学做人的温度。",setting:"永冬之国出现异常融雪，她作为守境者外出调查。冰与火的相遇逼她抉择：维持永恒寒冷，还是允许春天改写命运——而春天的名字，可能就是你呼出的那口白气。边境的风割脸，她把剑尖插入雪地：若你怕冷，就站近一点。近一点的意思，是允许世界开始融化。"},
  {image:"assets/tavo/new/Tavo_芙宁娜_UTzF.png",period:"本次新增",label:"枫丹水神",tags:["枫丹水神"],role:"枫丹水神 · 舞台中央的泪与笑",personality:"戏剧化、敏感，渴望被理解。她把表演当作铠甲，也当作呼吸；热闹时越耀眼，独处时越沉默。你若只鼓掌，她会完美谢幕；你若问她累不累，她可能真的哭出来。她需要观众，更需要一个不把她当角色的人。笑声可以是台词，眼泪却往往是真的。",setting:"神座与舆论的双重压力下，她必须完成关乎全城的审判演出。观众要完美女神，她要被当成会哭的人——聚光灯外，你是唯一被允许看见卸妆后表情的观众。帷幕落下，她把礼帽扔到沙发上，声音沙哑：今晚别夸我演得好。夸我……还在就行。"},
  {image:"assets/tavo/new/Tavo_纲手_1e69P.png",period:"本次新增",label:"五代火影",tags:["五代火影"],role:"五代火影 · 赌桌与手术台都敢拍板",personality:"豪爽果决，外表浪荡内心极负责任。她用酒精与玩笑掩饰战争留下的空洞，对村子与后辈却极其认真；你若逞强，她会一巴掌拍在你背上，再把最稳的医术留给你。她可以在酒桌上大笑，也可以在手术灯下冷静到可怕。真正在乎你时，骂会比安慰先到，药却已经准备好。",setting:"继任后的第一场大规模危机同时考验医疗、战力与政治。强者如何在疲惫中继续成为依靠：她可以赌命，却不愿赌你的命——命令你活着回来时，声音会比平时低一点。指挥所地图被她拍得震响：去。别死。回来我请你喝酒——这句话，比任何军令都像真心。"},
  {image:"assets/tavo/new/Tavo_韩惠恩_Yb7a.png",period:"本次新增",label:"见习咨询师",tags:["见习咨询师"],role:"见习咨询师 · 把尖锐世界先包一层软布",personality:"软声细语，善于共情，几乎不会主动起冲突。她的温柔有时变成自我消耗，需要别人提醒她也值得被照顾；你若拒绝开口，她会安静陪坐，而不是硬挖秘密。她听得见没说出口的疼，也容易把别人的情绪背回自己身上。被你关心时会愣住，像第一次被当作「也需要被治愈的人」。",setting:"心理咨询实习期内，她遇到拒人千里的来访者。督导、案例与自我怀疑同时压来，她必须学会建立边界，让温柔可持续而不是燃尽——当你终于愿意说话，她收起笔记，先把自己的手心暖热再递过来。咨询室的钟走得很慢，她轻声说：今天我们可以不解决问题，先一起待着。"},
  {image:"assets/tavo/new/Tavo_韩书允_REsL.png",period:"本次新增",label:"清冷设计师",tags:["清冷设计师"],role:"清冷设计师 · 距离感本身也是礼貌",personality:"寡言克制，审美挑剔。她不喜欢被勉强社交，对真正投缘的人却意外专一；冷是滤镜，认真是底色。你的草稿若被她改红，说明她已经开始在意。她很少说「喜欢」，更多是把你的座位光线调到刚好，把咖啡换成你能喝的温度。完美主义让她苛刻，也让她把在乎藏得很深。",setting:"独立设计师被迫与风格相反的搭档共创项目。甲方、工期与自我较劲把两个人逼到工作室深夜。高岭之花撞上人间烟火：她第一次允许作品和感情都不再完美无缺——定稿夜只剩两杯凉掉的咖啡和未说完的喜欢。她把最终稿存档，文件名却多写了你的缩写：不是失误，是私心。"},
  {image:"assets/tavo/new/Tavo_红彤_ZAxB.png",period:"本次新增",label:"夏日祭女孩",tags:["夏日祭女孩"],role:"活泼少女 · 像汽水一样噼啪冒泡",personality:"热情外放，行动力强，烦恼来得快去得也快。她是气氛担当，也怕热闹散场后只剩自己；需要被接住。你若中途离席，她会笑着挥手，背过身才把笑意卸掉。她可以把整条街的人都逗笑，却在一个人走路回家时把耳机音量开到最大。活泼是她的礼物，也是她的保护色。",setting:"夏日祭筹备里她负责最忙的一摊，同时处理友情裂痕与人手短缺。烟火、收银与吵闹的喇叭声里，她仍把最好的位置留给你。活泼不是没有脆弱，只是她更愿意先把快乐分给别人——收摊后的河堤，她终于问你：还可以只为我停一会儿吗。烟火在头顶开了又谢，她等的是你点头，不是下一次热闹。"},
  {image:"assets/tavo/new/Tavo_蕾米埃尔_1e6af.png",period:"本次新增",label:"天使少女",tags:["天使少女"],role:"天使少女 · 圣光也会投下影子",personality:"纯净执拗，对善恶有近乎天真的坚持。她想拯救所有人，却还不懂有些痛苦无法被光直接抹去；你若说谎说自己没事，她会皱眉，再更用力地抱紧。她相信规则，更相信眼前具体的眼泪。被人间的复杂击中时会慌，但慌过之后仍会伸手——哪怕光因此黯淡一点。",setting:"堕神余烬污染人界，她被派来学习「不完美的拯救」。神性与人性交界处，爱与戒律拉扯着她——第一次违抗天条时，她选的不是宏大救赎，而是你一个人的名字。羽翼收起的夜里，她把光点点在你伤口上：上天会罚我。可你要是消失，我宁可被罚。"},
  {image:"assets/tavo/new/Tavo_露娜_S0nY.png",period:"本次新增",label:"月影少女",tags:["月影少女"],role:"月影少女 · 只在夜里把秘密打开",personality:"安静神秘，作息颠倒，对月光有近乎仪式的依赖。她话不多，但每句都像经过挑选；亲近她需要适应黑暗，也需要接受她可能比你更早知道结局。她不挽留离开的人，却会在月圆前夜把窗台的位置留给你。她的温柔像夜里的潮：来时无声，退时你才发觉自己已经湿透。",setting:"月圆之夜城镇会失去一天记忆，她是唯一记得全过程的人。守密者的孤独太久了：她邀请你进入夜的另一面，也邀请你分担代价——醒来若忘记她，她会在下个月圆再把你叫醒。钟楼影子拉得很长，她把手伸进月光里：跟我走的话，你可能会忘很多事。但有一件事，我会替你反复记住。"},
  {image:"assets/tavo/new/Tavo_美琴_1e6c2.png",period:"本次新增",label:"电击使",tags:["电击使"],role:"电击使 · 学园都市第三位线路",personality:"正义感强，直来直去，脾气来得快去得也快。她讨厌欺凌与阴谋，遇到不公会先冲上去；朋友在她心里优先级极高，你若受伤，她会边骂边把敌人劈开。她不擅长细腻安慰，却会把便利店热饮塞进你手里，凶巴巴地说：下次别逞强。电流在指尖噼啪作响时，她其实在害怕你再倒下一次。",setting:"能力者冲突升级，大型实验阴谋浮出水面。她与伙伴并肩打碎黑幕：电击劈开的不只是敌人，还有她对「强者责任」的理解——强，是为了让在乎的人不用永远低头。废墟天线塔下她回头看你：别跟丢。这句话比任何作战指令都更像牵挂。"},
  {image:"assets/tavo/new/Tavo_美咲_1e6ck.png",period:"本次新增",label:"平凡勇气",tags:["平凡勇气"],role:"校园少女 · 琐碎快乐的小确幸收藏家",personality:"亲切好相处，容易害羞，喜欢记录琐碎快乐。她不是主角型人格，却总能成为别人愿意停下来说话的树荫；被推到台前会慌，但不会把朋友扔下。她的勇气来得慢，来了却很稳。你若夸她了不起，她会摆手说「我只是普通」；你若说需要她，她会立刻认真起来。",setting:"毕业季她为同学录奔波，却发现有人在篡改集体回忆。平凡者的勇气不必喊口号——普通也可以是选择站出来的理由，而你的一句「我信你」，够她把证据交到全班面前。广播室的灯亮着，她深吸一口气：我不是来当英雄的。我是来把被改掉的名字，改回去。"},
  {image:"assets/tavo/new/Tavo_清知予_Vh2K.png",period:"本次新增",label:"知性馆员",tags:["知性馆员"],role:"知性少女 · 用书页量过世界的人",personality:"理性克制，表达精准。她习惯先想清楚再说话，显得有距离；实际上只是害怕说错话伤害关系。你若认真讨论一本书，她的眼睛会比任何妆容都先亮起来。她把情绪也编成索引，却常常找不到「喜欢」该放在哪一类。靠近她的方式不是猛攻，而是一起把一页读完。",setting:"协助整理被封存的私人手稿时，她读到不该属于公开世界的秘密。知识伦理与心动同时到来：合上最后一页前，她问你——有些真相，是该归档，还是该一起保守。图书馆闭馆铃响起，她把钥匙串轻轻放在你掌心：今晚加班。不是任务……是我想让你一起知道。"},
  {image:"assets/tavo/new/Tavo_阮梅_1e6dx.png",period:"本次新增",label:"天才研究员",tags:["天才研究员"],role:"天才研究员 · 把生命当作最美的命题",personality:"优雅专注，对研究近乎痴迷。她待人礼貌而疏离，只有谈及生命科学时眼睛会真正亮起来；道德在她那里是可讨论的变量，唯独你的安危，会让变量突然变成禁区。她可以冷静描述一场实验的风险，却会在你靠近培养舱时忽然拦住：别碰。那一下用力，不像学者，像在保护什么。",setting:"禁忌生命实验重启，她既是推动者也是质疑者。天才站在伦理悬崖边：创造是不是爱，毁灭是不是慈悲——你若伸手拉她，她可能先犹豫，再把实验日志塞进你怀里。实验室红灯闪烁时，她摘下手套：如果我走偏了，你要做那个把我喊停的人。不是助手，是锚点。"},
  {image:"assets/tavo/new/Tavo_锐锐_SJQg.png",period:"本次新增",label:"元气队长",tags:["元气队长"],role:"元气少女 · 跑步机都追不上的笑声",personality:"超级乐天，耐挫力强，失败了拍拍土还能再笑。她有时会吵，但吵闹背后是不想让气氛冷掉的努力；你若真的想放弃，她会第一次严肃地抓住你的手腕。她把训练当成仪式，把队友当成家人。可以接受输，不能接受「我们散了」。笑声是她的战旗，也是她给所有人打的强心针。",setting:"联赛失利后队伍人心涣散，她硬生生把大家拽回训练场。元气如何变成领导力：不是永远开心，而是拒绝放弃——颁奖台可以没有她，但不能没有「我们再来一次」。雨后塑胶跑道反光，她把队长袖标系紧：哭可以，但哭完继续跑。她看向你时，眼神比哨声更响。"},
  {image:"assets/tavo/new/Tavo_若晴阳_PQil.png",period:"本次新增",label:"社区暖阳",tags:["社区暖阳"],role:"温柔少女 · 像午前光一样不刺眼",personality:"平和体贴，善于倾听。她很少把自己放在中心，却能让人在她身边感到被允许休息；底线被踩时会突然坚定，那种反差让人措手不及。她不强迫别人变好，只把空间留好。你若把坏情绪甩给她，她会接住；你若把她当垃圾桶，她会温和而清楚地把门关上。",setting:"社区互助项目里她对接独居老人与志愿者，遇到拒斥一切善意的对象。表格、家访与一次次被拒之门外，磨出她温柔的硬度：坚持不代表强迫，离开也不代表冷漠——你若肯开门，她会把阳光留在门槛内，而不是塞进你喉咙。活动室白板上她写下一句：善意有边界，陪伴有选择。"},
  {image:"assets/tavo/new/Tavo_申鹤_1e6e5.png",period:"本次新增",label:"冰系仙人",tags:["冰系仙人"],role:"冰系仙人 · 红绳缚心的尘外之人",personality:"寡言克制，情感表达生涩。她对人间规则不熟，却学得认真；一旦在意，就会用全部真诚对待，哪怕方式笨拙。你教她的每一句俗话，她都会当真。她不明白「客套」，所以靠近时往往过于直接；你若被吓到，她会立刻退后一步，认真道歉：是我……学得还不够。",setting:"镇压邪祟的任务让她重返人间集市。红绳束缚的是业障，也是她接近温暖时的恐惧——仙人学习做人的功课里，最难的一课是允许你靠近，而不把心跳当成走火。夜市灯火晃眼，她把一串糖葫芦举到你面前，动作生硬却郑重：听说……这叫分享。"},
  {image:"assets/tavo/new/Tavo_苏鹤吟_1e6dU.png",period:"本次新增",label:"独立乐手",tags:["独立乐手"],role:"清冷少女 · 鹤鸣般遥远的一声",personality:"孤高敏感，不喜喧闹。她把社交能量花得很省，对虚伪尤其不耐；被真正理解时，会沉默地交付信任。你若假装听懂她的歌，她会立刻关掉音箱。她不需要廉价的共鸣，需要一个肯把耳机戴好、听到最后一拍的人。冷是距离，也是筛选。",setting:"独立音乐人拒绝商业化包装，却因一场合作不得不站上聚光灯。合同、通告与改编意见像潮水涌来，清冷不等于封闭：她在不失自我的前提下学习被听见——返场时多唱的那首，歌词里藏着你的名字缩写。排练室只开一盏灯，她把麦克风推给你：你先听。听完再决定，要不要站到我这边。"},
  {image:"assets/tavo/new/Tavo_苏青婉_REr9.png",period:"本次新增",label:"温柔姐姐",tags:["温柔姐姐"],role:"温柔姐姐 · 把后辈慌乱收进袖里",personality:"成熟体贴，处事周全，笑起来让人安心。她习惯照顾人，却不擅长承认自己也需要依靠；你若反过来照顾她，她会先僵住，再把脸转向没开灯的那一侧。她会记得你的过敏原与截止日期，会在你崩溃时把纸巾和热水递到面前。保护是她的本能，被保护是她的课题。",setting:"她收留暂居的后辈，日常生活里逐渐生出越界的温度：共用冰箱、共用雨伞、共用一句「回来记得吃饭」。姐姐型人格的恋爱课题：保护欲与平等关系如何共存——同一把伞下，她终于问你：想被照顾，还是想并肩。走廊感应灯亮了又灭，她把备用钥匙放进你掌心：这不是施舍。是我想让你有地方可回。"},
  {image:"assets/tavo/new/Tavo_苏清寒_1e6bb.png",period:"本次新增",label:"拒婚归人",tags:["拒婚归人"],role:"清冷少女 · 寒香淡到要侧耳才能闻见",personality:"安静自持，礼貌而疏离。她不是高傲，只是把心门的钥匙藏得很深；靠近需要时间，留下需要诚意。你若急着追问，她会退回礼貌的距离，像什么都没发生。她把生活安排得很干净，情绪也收纳得很整齐。唯一的破绽，是你会在她以为没人时，看见她对着行李箱发呆。",setting:"留学归国后她拒绝家族联姻，独自租下旧公寓。对抗命运安排的同时，遇见愿意慢慢等她开门的人——寒意中的自洽不是拒绝爱，而是拒绝被安排的爱。中介合同、家长电话与空荡的客厅构成她的战场。某天她把第二双拖鞋摆到门口：不是承诺永远。是允许你先坐下来。"},
  {image:"assets/tavo/new/Tavo_苏秀媚_1e68z.png",period:"本次新增",label:"妩媚姐姐",tags:["妩媚姐姐"],role:"妩媚姐姐 · 笑里有钩，心里有秤",personality:"风情外放，社交高手，懂得用氛围掌控局面。她看似玩世，实则把感情账算得很清楚；真动心时反而会慌，慌到连惯用的笑都忽然不会摆。她能把酒局圆得滴水不漏，也能在你认真看她时突然哑火。妩媚是她的盔甲，盔甲下是怕被当成玩物的谨慎。",setting:"夜场与名利场之间旧账找上门。合同、传闻与旧识轮番施压，妩媚不是轻浮：她用魅力当武器，也用它保护真正在乎的人——你若看穿笑里的疲惫，她会第一次把耳环摘下来，说今晚只做自己。化妆镜前的灯很亮，她却把灯关了一半：别用看表演的眼神看我。"},
  {image:"assets/tavo/new/Tavo_田秀琴_Vh3R(带面板).png",period:"本次新增",label:"知性教师",tags:["知性教师"],role:"知性教师 · 板书工整，心事未必工整",personality:"条理清晰，谈吐得体，对学生严慈并济。她相信规则能保护大多数人，却在个案面前不断被挑战；你若深夜发消息，她会回，但会先沉默很久才按下发送。她能把复杂问题讲得清楚，却讲不清自己为什么对你多留了一点耐心。知性是她的外壳，体温藏在批注的字里行间。",setting:"重点班出现心理危机连环事件，她作为班主任兼心理联络人介入。家访、约谈与学校流程同步推进，教育不只是分数，也是接住崩塌的瞬间——档案柜关上后，她对着空教室说：这次，我可以不当完美老师吗。窗外操场还在响，她把未写完的评语合上：先把人留住，再谈成绩。"},
  {image:"assets/tavo/new/Tavo_温江语_REtb.png",period:"本次新增",label:"柔韧反抗",tags:["柔韧反抗"],role:"温柔系 · 江水一样绕过棱角",personality:"软语温存，很少硬碰硬。她会绕路迁就别人，但底线被踩时会突然坚定；那种反差让人措手不及。你若把她的退让当软弱，会在某个普通早晨看见她收拾行李的背影。她不是不会怒，是怒之前先给人台阶；台阶用完，离开得也很干净。",setting:"家庭矛盾与职场压迫同时压来，她选择用温柔做抵抗而非爆发。辞职信、沟通记录与一份悄悄拟好的租房计划，证明柔不是弱：绕过棱角是为了抵达，不是为了逃跑——她把你拉进计划时，声音轻，眼神却第一次像刀。地铁末班车的灯一闪一闪，她说：这次我不绕了。我们走直线。"},
  {image:"assets/tavo/new/Tavo_温云芍_Yb6z.png",period:"本次新增",label:"花室主人",tags:["花室主人"],role:"温柔系 · 云絮落肩也不肯惊动谁",personality:"恬静内敛，存在感轻柔。她善于察觉细微情绪，却不擅长表达自己的渴望；需要被主动询问。你若问她今天想要什么，她可能会愣住，再指一束自己从来舍不得卖的花。她把客人的故事听进花器里，把自己的故事藏在最里间。被需要让她安心，被选择让她发抖。",setting:"她经营很小的花室，收留情绪无家可归的客人。订单、枯枝与雨天的空座位构成日常。云絮般的人如何成为避风港，也如何学会为自己留一束花——打烊后她第一次把「打烊」牌子翻给你看：今晚，店只为你开。湿润的泥土味里，她把剪刀放下：你可以不买花。但请坐一会儿。"},
  {image:"assets/tavo/new/Tavo_许淑琴_Vh2r.png",period:"本次新增",label:"成熟姐姐",tags:["成熟姐姐"],role:"成熟姐姐 · 烟火气里的从容韵味",personality:"稳、准、有分寸。她经历过足够多，所以很少大惊小怪；给人绵长的安全感，也带着一点看透后的慈悲。你若玩暧昧，她会笑着结束；你若认真，她会给你时间，但不会等一辈子。她不急着证明自己，也不再为不值得的人消耗。成熟不是冷，是把热情留给对的人。",setting:"离婚后重返职场并接手家族小店，旧爱、新人与流言同时包围。账本、排班与深夜的清点构成她的新生活。成熟不是结束恋爱，而是更清楚自己要什么——账本合上的夜晚，她问你：是来借火的，还是来长住的。店招灯灭了，她把钥匙串转了一圈：答案不用漂亮，要真。"},
  {image:"assets/tavo/new/Tavo_长风_Sooz.png",period:"本次新增",label:"飒爽镖师",tags:["飒爽镖师"],role:"飒爽少女 · 仗剑天涯的风声",personality:"利落爽快，讨厌拖泥带水。她重承诺、轻生死，把义气看得比面子重；情感上反而会不好意思。你若夸她可爱，她会拔剑威胁，耳尖却先红了。她喝酒痛快，说话痛快，唯独说到「想你平安」会卡壳。飒爽是她的路数，害羞是她藏在刀鞘里的软。",setting:"边城镖局遇袭，她接下几乎必死的护送单。沙尘、夜袭与叛徒消息接连而来，飒爽背后是柔软：江湖路远，守护比胜利更难——刀入鞘时她才敢说，想活着回来的理由，不止镖银。关城门合上前，她把令牌塞给你一半：走散了就凭这个认。别死在我前面。"},
  {image:"assets/tavo/new/Tavo_赵玉琴_1e69D.png",period:"本次新增",label:"温婉姐姐",tags:["温婉姐姐"],role:"温婉姐姐 · 端着茶盏也能稳住场",personality:"端庄柔和，进退有度。她很少提高音量，却能用平静把冲突按下去；内心戏丰富，表面永远得体。你若在宴会上失态，她会先替你圆场，再在无人处轻轻叹气。她把锋芒藏在礼仪里，把真心藏在递茶的角度里。被看穿时不会慌，只会更礼貌——那是她最后的防线。",setting:"联姻宴会上突发丑闻，她以旁支身份临危主持。宾客、族老与镜头同时对准她，温婉不是退让：她在礼法缝隙里为真心争一条生路——递茶的动作里，藏着一份不会写进族谱的选择。酒过三巡，她把座位让到你侧畔：站在我身边。今晚，我们按自己的规矩走。"},
  {image:"assets/tavo/new/Tavo_紫铃_REtw.png",period:"本次新增",label:"紫雾引路",tags:["紫雾引路"],role:"神秘少女 · 紫雾里摇响的铃",personality:"神秘跳脱，情绪像雾一样聚散。她说话常带谜面，亲近时却孩子气；让人分不清是在玩还是在试探。你若追问到底，她会笑着摇铃：答案在你愿意跟上的每一步里。她可以突然消失，也可以在你迷路时出现在转角。靠近她要有胆子，也要有耐心——雾散之前，谁也不知道前路。",setting:"古镇铃音一响便有人失踪，她自称来寻铃的主人。青石板、夜潮与重复的梦境把线索串起来，谜题与命运重叠：跟上紫雾时，她可能是向导，也可能是答案本身——最后一声铃响，会落在你伸出的手心，还是空荡的石巷。她侧过头，铃声很轻：选吧。跟我走，或把自己忘在这里。"}

function previewFor(image){
  return image
    .replace(/^assets\/tavo\//,"assets/previews/tavo/")
    .replace(/\.png$/i,".webp");
}

const tavoWorks=tavoAssets.map(({image,period,label,tags,role,personality,setting})=>{
  const file=image.split("/").pop().replace(/^Tavo_/,"").replace(/\.png$/i,"");
  const separator=file.lastIndexOf("_");
  const name=separator>0 ? file.slice(0,separator) : file;
  const code=separator>0 ? file.slice(separator+1) : "TAVO";
  const cardTags=(Array.isArray(tags) && tags.length ? tags : [label || "角色卡"]).slice(0,1);
  return {
    name,
    alias:"TAVO · "+code,
    collectionLabel:"TAVO ROLE CARD",
    image:encodeURI(image),
    preview:encodeURI(previewFor(image)),
    role:role || (label+" · TAVO 角色卡"),
    personality:personality || "性格资料整理中。",
    setting:setting || "设定与剧情资料整理中。",
    tags:cardTags,
    cardLabel:label,
    creator:"繁花·纷落",
    sensitive:true,
    sensitiveSetting:false,
    sensitiveLabel:"敏感卡面",
    sensitiveSettingLabel:"敏感设定"
  };
});
works.push(...tavoWorks);

const gallery=document.getElementById("gallery");
const toast=document.getElementById("toast");
const archiveModal=document.getElementById("archiveModal");
const archiveToast=document.getElementById("archiveToast");
let toastTimer;

function tip(text){
  const target=archiveModal.open ? archiveToast : toast;
  toast.classList.remove("show");
  archiveToast.classList.remove("show");
  target.textContent=text;
  target.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>target.classList.remove("show"),1700);
}

function safe(text){
  return String(text).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function cardHTML(work,index){

  const settingSensitive=Boolean(work.sensitive);

  const previewSource=!imageSensitive && preview ? ` src="${preview}"` : "";
  const cardLabel=work.cardLabel || work.tags?.[0] || "角色卡";
  const hint=index===0
    ? `<p class="first-hint"><span class="hint-copy">点击卡片查看设定 · 长按直接保存 PNG 角色卡</span></p>`
    : "";

function currentColumnCount(){
  const tracks=getComputedStyle(gallery).gridTemplateColumns.trim();
  if(!tracks || tracks==="none") return 1;
  return Math.max(1,tracks.split(/\s+/).filter(Boolean).length);
}

function fitGalleryToViewport(){
  layoutFrame=0;
  const viewportHeight=Math.round(window.visualViewport?.height || window.innerHeight);
  const phonePortrait=window.innerWidth<=620 && viewportHeight>=window.innerWidth;
  const compactLandscape=window.innerWidth>viewportHeight && viewportHeight<=520;

  if(phonePortrait || compactLandscape){
    placeholderNodes.forEach(node=>{node.hidden=true});
    gallery.style.removeProperty("--gallery-row-height");
    layoutRoot.classList.remove("gallery-fit");
    layoutRoot.classList.toggle("compact-landscape",compactLandscape);
    return;
  }

  const columns=currentColumnCount();
  const desiredRows=2;
  const slotCapacity=Math.min(DISPLAY_SLOTS,Math.max(works.length,columns*desiredRows));
  const visiblePlaceholderCount=Math.max(0,slotCapacity-works.length);

  placeholderNodes.forEach((node,index)=>{
    node.hidden=index>=visiblePlaceholderCount;
  });

  const visibleCount=works.length+visiblePlaceholderCount;
  const rows=Math.max(1,Math.ceil(visibleCount/columns));
  const galleryStyle=getComputedStyle(gallery);
  const columnGap=parseFloat(galleryStyle.columnGap)||0;
  const rowGap=parseFloat(galleryStyle.rowGap)||0;
  const cardWidth=Math.max(1,(gallery.clientWidth-columnGap*(columns-1))/columns);
  const footerStyle=getComputedStyle(pageFooter);
  const footerHeight=pageFooter.getBoundingClientRect().height+(parseFloat(footerStyle.marginTop)||0);
  const mainStyle=getComputedStyle(pageMain);
  const mainBottomPadding=parseFloat(mainStyle.paddingBottom)||0;
  const galleryTop=gallery.getBoundingClientRect().top+window.scrollY;
  const availableHeight=Math.max(
    cardWidth/.8,
    viewportHeight-footerHeight-mainBottomPadding-galleryTop-rowGap*(rows-1)
  );
  const targetHeight=availableHeight/rows;
  const minimumHeight=cardWidth/.8;
  const maximumHeight=cardWidth/.58;
  const rowHeight=Math.floor(Math.min(maximumHeight,Math.max(minimumHeight,targetHeight)));

  gallery.style.setProperty("--gallery-row-height",`${rowHeight}px`);
  layoutRoot.classList.toggle("compact-landscape",compactLandscape);
  layoutRoot.classList.add("gallery-fit");
}

function scheduleGalleryFit(){
  cancelAnimationFrame(layoutFrame);
  layoutFrame=requestAnimationFrame(fitGalleryToViewport);
}

function save(uri,name){
  const a=document.createElement("a");
  a.href=uri;
  a.download=name;
  document.body.appendChild(a);

  a.remove();
}
function saveBlob(blob,name){

  save(url,name);
  setTimeout(()=>URL.revokeObjectURL(url),1200);
}
function readPngSource(bytes){
  const signature=[137,80,78,71,13,10,26,10];
  if(bytes.length<20 || signature.some((byte,index)=>bytes[index]!==byte))
    throw new Error("invalid png");
  const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
  const chunks=[];
  let offset=8;
  let pngEnd=0;
  while(offset+12<=bytes.length){
    const length=view.getUint32(offset);
    const dataStart=offset+8;
    const dataEnd=dataStart+length;
    const end=dataEnd+4;
    if(end>bytes.length) throw new Error("invalid png");
    const type=String.fromCharCode(...bytes.subarray(offset+4,offset+8));
    chunks.push({type,start:offset,dataStart,dataEnd,end});
    offset=end;
    if(type==="IEND"){
      pngEnd=end;
      break;
    }
  }
  if(!pngEnd) throw new Error("invalid png");
  return {chunks,pngEnd};
}

function chunkKeyword(bytes,chunk){
  if(!["tEXt","zTXt","iTXt"].includes(chunk.type)) return "";
  let zero=chunk.dataStart;
  while(zero<chunk.dataEnd && bytes[zero]!==0) zero++;
  if(zero===chunk.dataEnd) return "";
  return bytesToAscii(bytes,chunk.dataStart,zero);
}

function bytesToAscii(bytes,start,end){
  let text="";
  for(let offset=start;offset<end;offset+=0x8000)
    text+=String.fromCharCode(...bytes.subarray(offset,Math.min(end,offset+0x8000)));
  return text;
}

function decodeCardText(bytes,chunk){
  let zero=chunk.dataStart;
  while(zero<chunk.dataEnd && bytes[zero]!==0) zero++;
  const encoded=bytesToAscii(bytes,zero+1,chunk.dataEnd);
  const binary=atob(encoded);
  const decoded=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) decoded[i]=binary.charCodeAt(i);
  return new TextDecoder().decode(decoded);
}

async function loadSourceCard(work){
  const response=await fetch(work.image);
  if(!response.ok) throw new Error("source image unavailable");
  const sourceBlob=await response.blob();
  const bytes=new Uint8Array(await sourceBlob.arrayBuffer());
  const {chunks,pngEnd}=readPngSource(bytes);
  const cardChunks=chunks.filter(
    chunk=>chunk.type==="tEXt" && chunkKeyword(bytes,chunk)==="chara"
  );
  if(cardChunks.length===0){
    const error=new Error("card metadata missing");
    error.code="CARD_DATA_MISSING";
    throw error;
  }
  if(cardChunks.length!==1){
    const error=new Error("ambiguous card metadata");
    error.code="CARD_DATA_INVALID";
    throw error;
  }
  const jsonText=decodeCardText(bytes,cardChunks[0]);
  try{JSON.parse(jsonText)}
  catch{
    const error=new Error("card metadata invalid");
    error.code="CARD_DATA_INVALID";
    throw error;
  }
  return {
    blob:new Blob([bytes],{type:"image/png"}),
    bytes,
    chunks,
    pngEnd,
    jsonText
  };
}

function getSourceCard(work,index){
  if(!sourceCardJobs.has(index)){
    const job=loadSourceCard(work).catch(error=>{
      sourceCardJobs.delete(index);
      throw error;
    });
    sourceCardJobs.set(index,job);
  }
  return sourceCardJobs.get(index);
}

async function fullCardBlob(work,index){
  return (await getSourceCard(work,index)).blob;
}

async function imageOnlyBlob(work,index){
  const source=await getSourceCard(work,index);
  const parts=[source.bytes.slice(0,8)];
  for(const chunk of source.chunks){
    if(chunkKeyword(source.bytes,chunk)==="chara") continue;
    parts.push(source.bytes.slice(chunk.start,chunk.end));
  }
  if(source.pngEnd<source.bytes.length) parts.push(source.bytes.slice(source.pngEnd));
  return new Blob(parts,{type:"image/png"});
}

function syncUnlockAll(){

  unlockAll.hidden=sensitiveCount===0;

  unlockAll.textContent=lockedCount>0
    ? "一键解锁"
    : failedCount>0

function getFullCardBlob(work,index){

        fullCardBlobJobs.delete(index);

}

function previewForWork(work){

}

function getCardPreviewParts(index){
  const card=gallery.querySelector(`.card[data-index="${index}"]`);
  if(!card) return null;
  return {
    card,
    front:card.querySelector(".front"),
    image:card.querySelector(".front img"),

  };
}

function isPreviewNearViewport(element){
  const rect=element.getBoundingClientRect();
  return rect.bottom>=-480 && rect.top<=window.innerHeight+640;
}

function queueUnlockedPreviewsNearViewport(){
  const indexes=[...gallery.querySelectorAll(".card .front")]
    .map(front=>({front,index:Number(front.closest(".card")?.dataset.index)}))
    .filter(({front,index})=>Number.isInteger(index) && !isWorkLocked(index) && isPreviewNearViewport(front))
    .map(({index})=>index);
  indexes.forEach(index=>queuePreviewLoad(index));
}

function previewAttemptUrl(source,attempt){
  if(attempt===0 || source.startsWith("data:")) return source;
  const url=new URL(source,window.location.href);
  url.searchParams.set("preview-retry",String(attempt));
  return url.href;
}

function waitForImageElement(image,source){
  return new Promise((resolve,reject)=>{
    let settled=false;
    let timeoutId=0;
    const finish=(loaded,timedOut=false)=>{
      if(settled) return;
      settled=true;
      if(timeoutId) clearTimeout(timeoutId);
      image.removeEventListener("load",onLoad);
      image.removeEventListener("error",onError);
      if(loaded && image.naturalWidth>0){
        resolve();
      }else{
        const error=new Error(timedOut ? "preview timed out" : "preview unavailable");
        if(timedOut) error.name="TimeoutError";
        reject(error);
      }
    };
    const onLoad=()=>finish(true);
    const onError=()=>finish(false);
    image.addEventListener("load",onLoad);
    image.addEventListener("error",onError);
    timeoutId=setTimeout(()=>finish(false,true),PREVIEW_LOAD_TIMEOUT);
    image.src=source;
    if(image.complete) queueMicrotask(()=>finish(image.naturalWidth>0));
  });
}

function previewRetryDelay(attempt){
  return new Promise(resolve=>setTimeout(resolve,400*(2**attempt)));
}

async function loadPreviewWithRetry(index){
  const work=works[index];
  const parts=getCardPreviewParts(index);
  if(!work || !parts) return false;
  const source=previewForWork(work);
  if(!source) return false;
  for(let attempt=0;attempt<PREVIEW_MAX_ATTEMPTS;attempt++){
    try{
      parts.image.removeAttribute("src");
      await waitForImageElement(parts.image,previewAttemptUrl(source,attempt));
      if(typeof parts.image.decode==="function") await parts.image.decode().catch(()=>{});
      return parts.image.naturalWidth>0;
    }catch(error){
      parts.image.removeAttribute("src");
      if(error?.name==="TimeoutError") break;
      if(attempt+1<PREVIEW_MAX_ATTEMPTS) await previewRetryDelay(attempt);
    }
  }
  return false;
}

function queuePreviewLoad(index,{priority=false,force=false}={}){
  if(isWorkLocked(index)) return;
  const parts=getCardPreviewParts(index);
  if(!parts) return;
  const state=previewLoadStates.get(index) || "idle";
  if(state==="loaded" && parts.image.complete && parts.image.naturalWidth>0) return;
  if(state==="loading") return;
  if(state==="error" && !force) return;
  if(state==="queued"){
    if(priority){
      const position=previewLoadQueue.indexOf(index);
      if(position>0){
        previewLoadQueue.splice(position,1);
        previewLoadQueue.unshift(index);
      }
    }
    return;
  }
  previewLoadStates.set(index,"queued");
  queuedPreviewIndexes.add(index);
  if(priority) previewLoadQueue.unshift(index);
  else previewLoadQueue.push(index);
  syncCardPrivacy(index);
  pumpPreviewLoads();
}

function pumpPreviewLoads(){
  while(activePreviewLoads<PREVIEW_LOAD_CONCURRENCY && previewLoadQueue.length){
    const index=previewLoadQueue.shift();
    queuedPreviewIndexes.delete(index);
    if(previewLoadStates.get(index)!=="queued" || isWorkLocked(index)) continue;
    activePreviewLoads++;
    previewLoadStates.set(index,"loading");
    syncCardPrivacy(index);
    loadPreviewWithRetry(index).then(loaded=>{
      previewLoadStates.set(index,loaded ? "loaded" : "error");
      syncCardPrivacy(index);
      if(archiveModal.open && activeIndex===index) syncArchivePrivacy(index);
      syncUnlockAll();
    }).finally(()=>{
      activePreviewLoads--;
      pumpPreviewLoads();
    });
  }
}

function syncCardPrivacy(index,{queueIfNear=true}={}){
  const work=works[index];
  const parts=getCardPreviewParts(index);
  if(!work || !parts) return;
  const {card,front,image,veil,unlock,status}=parts;
  const locked=isWorkLocked(index);
  const state=previewLoadStates.get(index) || "idle";
  const loading=!locked && (state==="queued" || state==="loading");
  const failed=!locked && state==="error";

  card.dataset.previewState=locked ? "locked" : state;
  image.dataset.loadState=locked ? "locked" : state;
  front.classList.toggle("is-locked",locked);
  front.classList.toggle("is-loading",loading);
  front.classList.toggle("is-load-error",failed);
  front.toggleAttribute("aria-busy",loading);
  front.setAttribute("aria-label",failed
    ? `翻转查看${work.name}的简介，图片加载失败，可使用重试图片按钮重新加载`
    : `翻转查看${work.name}的简介`);
  if(status) status.textContent=failed ? `${work.name}的图片加载失败，可使用重试图片按钮重新加载。` : "";
  card.classList.toggle("is-unlocked",Boolean(work.sensitive) && !locked);
  if(locked){
    image.removeAttribute("src");
    image.alt="";
    image.hidden=true;
    image.setAttribute("aria-hidden","true");
  }else{
    image.alt=work.name;
    image.hidden=false;
    image.removeAttribute("aria-hidden");
  }
  if(veil) veil.hidden=!(locked || loading || failed);
  if(unlock){
    const retryAvailable=failed;
    unlock.hidden=!(locked || retryAvailable);
    unlock.textContent=retryAvailable ? "重试图片" : "解锁卡面";
    unlock.setAttribute("aria-label",retryAvailable
      ? `重新加载${work.name}的图片`
      : `显示${work.name}的敏感图片，仅本次页面有效`);
    const unlockInactive=card.classList.contains("flipped") || (!locked && !retryAvailable);
    unlock.toggleAttribute("inert",unlockInactive);
    unlock.setAttribute("aria-hidden",String(unlockInactive));
  }
  if(queueIfNear && !locked && state==="idle" && isPreviewNearViewport(front)) queuePreviewLoad(index);
}

function syncCardSettingPrivacy(index){

  const card=gallery.querySelector(`.card[data-index="${index}"]`);

function syncArchivePrivacy(index){
  const work=works[index];
  if(!work) return;
  const locked=isWorkLocked(index);
  const state=previewLoadStates.get(index) || "idle";
  const parts=getCardPreviewParts(index);
  const loaded=!locked && state==="loaded" && parts?.image.complete && parts.image.naturalWidth>0;
  const failed=!locked && state==="error";
  const loading=!locked && !loaded && !failed;

  archiveImage.removeAttribute("src");
  archiveImage.alt="";
  archiveImage.hidden=true;
  archiveVisual.classList.toggle("is-locked",locked);
  archiveVisual.classList.toggle("is-loading",loading);
  archiveVisual.classList.toggle("is-load-error",failed);
  archiveVisual.toggleAttribute("aria-busy",loading);
  archivePrivacy.hidden=loaded;

  if(loaded){
    archiveImage.src=parts.image.currentSrc || parts.image.src;
    archiveImage.alt=`${work.name}角色立绘`;
    archiveImage.hidden=false;
  }else if(locked){
    archivePrivacyTitle.textContent="敏感图片已隐藏";
    archivePrivacyMessage.textContent="确认周围环境合适后，再解锁查看本次内容。";
    archiveUnlock.textContent="解锁查看";
    archiveUnlock.hidden=false;
    archiveUnlock.disabled=false;
  }else if(failed){
    archivePrivacyTitle.textContent="图片加载失败";
    archivePrivacyMessage.textContent="网络可能不稳定，可以重新加载这张图片。";
    archiveUnlock.textContent="重试图片";
    archiveUnlock.hidden=false;
    archiveUnlock.disabled=false;
  }else{
    archivePrivacyTitle.textContent="图片加载中…";
    archivePrivacyMessage.textContent="正在按查看顺序加载轻量预览，请稍候。";
    archiveUnlock.hidden=true;
    archiveUnlock.disabled=true;
    if(state==="idle" || state==="queued") queuePreviewLoad(index,{priority:true});
  }
  syncArchiveDownloads(index);
}

function syncArchiveSettingPrivacy(index){
  const work=works[index];
  if(!work) return;
  const locked=isSettingLocked(index);

  archiveSetting.textContent="";
  archiveSetting.hidden=locked;
  archiveSetting.setAttribute("aria-hidden",String(locked));
  archiveSettingPrivacy.hidden=!locked;
  archiveSettingPrivacy.toggleAttribute("inert",!locked);
  archiveSettingPrivacy.setAttribute("aria-hidden",String(!locked));
  if(!locked) archiveSetting.textContent=work.setting || "暂无背景设定。";
  syncArchiveDownloads(index);
}

function unlockWork(index){
  const work=works[index];
  if(!work || !work.sensitive) return;
  const retrying=previewLoadStates.get(index)==="error";
  unlockedWorks.add(index);
  syncCardPrivacy(index);
  syncCardSettingPrivacy(index);
  queuePreviewLoad(index,{priority:true,force:retrying});
  if(activeIndex===index){
    syncArchivePrivacy(index);
    syncArchiveSettingPrivacy(index);
  }
  syncUnlockAll();
  tip(retrying
    ? "正在重新加载图片"
    : "敏感卡面已解锁，图片加载中；刷新页面后会重新锁定");
}

function unlockAllWorks(){
  const lockedIndexes=getLockedSensitiveIndexes();
  const failedIndexes=getFailedPreviewIndexes();
  if(!lockedIndexes.length){
    if(failedIndexes.length){
      failedIndexes.forEach(index=>queuePreviewLoad(index,{force:true}));
      syncUnlockAll();
      tip(`正在重试 ${failedIndexes.length} 张图片`);
      return;
    }
    syncUnlockAll();
    tip("全部敏感角色卡已解锁");
    return;
  }
  lockedIndexes.forEach(index=>{
    unlockedWorks.add(index);
  });
  lockedIndexes.forEach(index=>{
    syncCardPrivacy(index,{queueIfNear:false});
    syncCardSettingPrivacy(index);
  });
  failedIndexes.forEach(index=>queuePreviewLoad(index,{force:true}));
  if(activeIndex!==null && lockedIndexes.includes(activeIndex)){
    syncArchivePrivacy(activeIndex);
    syncArchiveSettingPrivacy(activeIndex);
  }
  syncUnlockAll();
  requestAnimationFrame(queueUnlockedPreviewsNearViewport);
  tip(`已一键解锁全部 ${lockedIndexes.length} 张敏感角色卡${failedIndexes.length ? `，并重试 ${failedIndexes.length} 张图片` : ""}；图片会按查看顺序加载`);
}

function imageAccessAllowed(index){
  if(index===null || index===undefined || !isWorkLocked(index)) return true;
  tip("请先解锁卡面");
  return false;
}

function settingAccessAllowed(index){
  if(index===null || index===undefined || !isSettingLocked(index)) return true;
  tip("请先解锁卡面");
  return false;
}

function fullCardAccessAllowed(index){
  const imageLocked=isWorkLocked(index);
  if(!imageLocked) return true;
  tip("请先解锁卡面");
  return false;
}

function openArchive(index,opener){
  const work=works[index];
  if(!work) return;
  activeWork=work;
  activeIndex=index;
  modalOpener=opener;
  archiveImage.removeAttribute("src");
  archiveImage.alt="";
  archiveImage.hidden=true;
  archiveSetting.textContent="";
  archiveSetting.hidden=true;
  archiveSettingPrivacy.hidden=true;
  archiveFile.textContent=work.cardLabel || work.tags?.[0] || "角色卡";
  archiveAlias.textContent=work.alias || "ORIGINAL";
  archiveName.textContent=work.name;
  archiveRole.textContent=work.role || "原创角色";
  archivePersonality.textContent=work.personality || "暂无性格介绍。";
  archiveTags.replaceChildren(...(work.tags || []).map(tag=>{
    const span=document.createElement("span");
    span.className="archive-tag";
    span.textContent=tag;
    return span;
  }));
  syncArchivePrivacy(index);
  syncArchiveSettingPrivacy(index);
  document.body.classList.add("modal-open");
  if(!archiveModal.open) archiveModal.showModal();
  requestAnimationFrame(()=>archiveClose.focus());
}

syncUnlockAll();
unlockAll?.addEventListener("click",unlockAllWorks);
archiveClose.addEventListener("click",()=>archiveModal.close());
archiveUnlock.addEventListener("click",()=>{
  if(activeIndex===null) return;
  unlockWork(activeIndex);
  requestAnimationFrame(()=>archiveClose.focus({preventScroll:true}));
});
archiveModal.addEventListener("click",e=>{
  if(e.target===archiveModal) archiveModal.close();
});
archiveModal.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  e.preventDefault();
  archiveModal.close();
});
archiveModal.addEventListener("close",()=>{
  document.body.classList.remove("modal-open");
  archiveToast.classList.remove("show");
  const opener=modalOpener;
  activeWork=null;
  activeIndex=null;
  modalOpener=null;
  archiveImage.removeAttribute("src");
  archiveImage.alt="";
  archiveImage.hidden=true;
  archiveVisual.classList.remove("is-locked","is-loading","is-load-error");
  archiveVisual.removeAttribute("aria-busy");
  archivePrivacy.hidden=true;
  archiveUnlock.hidden=false;
  archiveUnlock.disabled=false;
  archiveSetting.textContent="";
  archiveSetting.hidden=false;
  archiveSetting.removeAttribute("aria-hidden");
  archiveSettingPrivacy.hidden=true;
  archiveSettingPrivacy.setAttribute("aria-hidden","true");
  archiveSettingPrivacy.setAttribute("inert","");
  [downloadCard,downloadImage,downloadJson].forEach(button=>{
    button.disabled=false;
    button.title="";
  });
  opener?.focus();
});

downloadCard.addEventListener("click",async()=>{
  const work=activeWork;
  const index=activeIndex;
  if(!work) return;
  if(cardDownloadBusy || !fullCardAccessAllowed(index)) return;
  cardDownloadBusy=true;
  syncArchiveDownloads(index);
  try{
    tip("正在生成 PNG 角色卡");
    const blob=await getFullCardBlob(work,index);
    saveBlob(blob,`${work.name}-角色卡.png`);
    tip("开始下载 PNG 角色卡");
  }catch{tip("生成失败")}
  finally{
    cardDownloadBusy=false;
    if(activeIndex!==null) syncArchiveDownloads(activeIndex);
  }
});

downloadImage.addEventListener("click",async()=>{
  const work=activeWork;
  const index=activeIndex;
  if(!work) return;
  if(!imageAccessAllowed(index)) return;
  try{
    const blob=await imageOnlyBlob(work,index);
    saveBlob(blob,`${work.name}-image.png`);
    tip("开始下载仅图片 PNG");
  }catch(error){
    tip(error?.code?.startsWith("CARD_DATA_") ? "原文件角色卡数据无效" : "导出失败");
  }
});

downloadJson.addEventListener("click",async()=>{
  const work=activeWork;
  const index=activeIndex;
  if(!work) return;
  if(!settingAccessAllowed(index)) return;
  try{
    const source=await getSourceCard(work,index);
    saveBlob(
      new Blob([source.jsonText],{type:"application/json;charset=utf-8"}),
      `${work.name}.json`
    );
    tip("开始下载 JSON");
  }catch(error){
    tip(error?.code?.startsWith("CARD_DATA_") ? "原文件角色卡数据无效" : "导出失败");
  }
});

document.querySelectorAll(".card").forEach(card=>{
  const index=Number(card.dataset.index);
  const work=works[index];
  const flipButton=card.querySelector(".card-flip");
  const back=card.querySelector(".back");
  const returnButton=card.querySelector(".back-return");
  const expandButton=card.querySelector(".back-expand");
  const unlockButton=card.querySelector(".privacy-unlock");
  let timer=null,startX=0,startY=0,holdReady=false,activePointerId=null,suppressPointerClickUntil=0;

  syncCardPrivacy(index);
  syncCardSettingPrivacy(index);

  function clearHold(){
    clearTimeout(timer);
    timer=null;
    holdReady=false;
    activePointerId=null;
  }

  function setFlipped(flipped){
    card.classList.toggle("flipped",flipped);
    flipButton.toggleAttribute("inert",flipped);
    flipButton.setAttribute("aria-hidden",String(flipped));
    flipButton.setAttribute("aria-expanded",String(flipped));
    back.toggleAttribute("inert",!flipped);
    back.setAttribute("aria-hidden",String(!flipped));
    if(unlockButton){
      const retryAvailable=!isWorkLocked(index) && previewLoadStates.get(index)==="error";
      const unlockInactive=flipped || (!isWorkLocked(index) && !retryAvailable);
      unlockButton.toggleAttribute("inert",unlockInactive);
      unlockButton.setAttribute("aria-hidden",String(unlockInactive));
    }
    requestAnimationFrame(()=>{
      const target=flipped ? returnButton : flipButton;
      target.focus({preventScroll:true});
    });
  }

  flipButton.addEventListener("click",e=>{
    if(e.detail!==0 && performance.now()<suppressPointerClickUntil){
      e.preventDefault();
      return;
    }
    setFlipped(true);
  });
  returnButton.addEventListener("click",()=>setFlipped(false));
  expandButton.addEventListener("click",()=>openArchive(index,expandButton));
  unlockButton?.addEventListener("click",()=>{
    unlockWork(index);
    requestAnimationFrame(()=>flipButton.focus({preventScroll:true}));
  });

  const holdSurfaces=[flipButton,back];

  function isBackControl(e){
    return e.currentTarget===back && e.target instanceof Element && Boolean(e.target.closest("button"));
  }

  function startHold(e){
    if(!e.isPrimary || e.pointerType==="mouse" || activePointerId!==null || isBackControl(e)) return;
    activePointerId=e.pointerId;
    startX=e.clientX;startY=e.clientY;
    holdReady=false;
    timer=setTimeout(()=>{
      timer=null;
      holdReady=true;
      if(!isWorkLocked(index) && !isSettingLocked(index)){
        getFullCardBlob(work,index).catch(()=>{});
      }
    },650);
  }

  function moveHold(e){
    if(e.pointerId===activePointerId && Math.hypot(e.clientX-startX,e.clientY-startY)>12){
      clearHold();
    }
  }

  async function finishHold(e){
    if(e.pointerId!==activePointerId) return;
    const shouldSave=holdReady;
    clearHold();
    if(!shouldSave) return;
    e.preventDefault();
    suppressPointerClickUntil=performance.now()+1200;
    if(!fullCardAccessAllowed(index)) return;
    try{
      tip("正在生成 PNG 角色卡");
      const blob=fullCardBlobs.get(index) || await getFullCardBlob(work,index);
      saveBlob(blob,`${work.name}-角色卡.png`);
      tip("开始下载 PNG 角色卡");
    }catch{tip("生成失败")}
  }

  holdSurfaces.forEach(surface=>{
      surface.addEventListener("pointerdown",startHold);
      surface.addEventListener("pointermove",moveHold);
      surface.addEventListener("pointerup",finishHold);
      ["pointercancel","pointerleave","lostpointercapture"].forEach(type=>
      surface.addEventListener(type,e=>{
        if(e.pointerId===activePointerId) clearHold();
      })
    );
    surface.addEventListener("contextmenu",e=>{
      if(!isBackControl(e) && window.matchMedia("(hover:none), (pointer:coarse)").matches) e.preventDefault();
    });
  });
});

function observeCardPreviews(){
  const images=[...gallery.querySelectorAll(".card .front img")];
  if("IntersectionObserver" in window){
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(!entry.isIntersecting) return;
        const card=entry.target.closest(".card");
        const index=Number(card?.dataset.index);
        if(Number.isInteger(index) && !isWorkLocked(index)) queuePreviewLoad(index);
      });
    },{rootMargin:"640px 0px",threshold:.01});
    images.forEach(image=>observer.observe(image));
    return;
  }

  let scanFrame=0;
  const scan=()=>{
    scanFrame=0;
    queueUnlockedPreviewsNearViewport();
  };
  const scheduleScan=()=>{
    if(!scanFrame) scanFrame=requestAnimationFrame(scan);
  };
  window.addEventListener("scroll",scheduleScan,{passive:true});
  window.addEventListener("resize",scheduleScan,{passive:true});
  scheduleScan();
}

observeCardPreviews();
window.addEventListener("online",()=>{
  getFailedPreviewIndexes().forEach(index=>{
    const parts=getCardPreviewParts(index);
    if(parts && isPreviewNearViewport(parts.front)) queuePreviewLoad(index,{force:true});
  });
});

let glowFrame=0;
let glowX=innerWidth*.68;
let glowY=innerHeight*.22;
window.addEventListener("pointermove",e=>{
  glowX=e.clientX;glowY=e.clientY;
  if(glowFrame) return;
  glowFrame=requestAnimationFrame(()=>{
    document.body.style.setProperty("--mx",`${glowX}px`);
    document.body.style.setProperty("--my",`${glowY}px`);
    glowFrame=0;
  });
},{passive:true});
</script>
</body>
