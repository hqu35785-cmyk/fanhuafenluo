<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>霖霖 · Works</title>
<style>
:root {
  --bg:#0d0b10;
  --panel:#17131b;
  --panel2:#1d1722;
  --line:rgba(255,255,255,.10);
  --text:#fff8fb;
  --muted:#a99eaa;
  --pink:#f2a8bd;
}
*{box-sizing:border-box}
html{
  min-height:100%;
  scroll-behavior:smooth;
  background:#0d0b10;
}
body{
  min-height:100vh;
  margin:0;
  color:var(--text);
  background:
    radial-gradient(circle at 0 0,rgba(242,168,189,.13),transparent 28%),
    radial-gradient(circle at 100% 8%,rgba(153,180,235,.09),transparent 24%),
    var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
button{font:inherit}
img{display:block;max-width:100%}
.wrap{width:min(1720px,calc(100% - 16px));margin:auto}

header{
  height:68px;
  display:flex;
  align-items:center;
  border-bottom:1px solid var(--line);
}
nav{width:100%;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:38px;height:38px;border-radius:12px;object-fit:cover}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.12em}
.brand span{display:block;margin-top:4px;color:var(--text);font-size:16px;letter-spacing:.02em}
nav a{color:#d8ced8;text-decoration:none;font-size:12px}

main{padding:20px 0 12px}
.catalog{
  display:grid;
  grid-template-columns:26px minmax(0,1fr);
  align-items:start;
  gap:8px;
}
.side-title{
  margin:4px 0 0;
  color:#d8ced8;
  font-size:12px;
  font-weight:400;
  letter-spacing:0;
  writing-mode:vertical-rl;
  text-orientation:upright;
}
.gallery{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:10px;
}
.card-item{
  min-width:0;
}
.card{
  position:relative;
  aspect-ratio:.72;
  perspective:1200px;
  cursor:pointer;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
}
.card-inner{
  position:absolute;
  inset:0;
  transform-style:preserve-3d;
  transition:transform .48s cubic-bezier(.2,.75,.2,1);
}
.card.flipped .card-inner{transform:rotateY(180deg)}
.front{pointer-events:auto}
.back{pointer-events:none}
.card.flipped .front{pointer-events:none}
.card.flipped .back{pointer-events:auto}
.first-hint{
  margin:9px 4px 0;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}
.placeholder-card{
  aspect-ratio:.72;
  border:1px dashed rgba(255,255,255,.10);
  border-radius:20px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.025),rgba(255,255,255,.008));
}
.face{
  position:absolute;
  inset:0;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--panel);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  box-shadow:0 18px 44px rgba(0,0,0,.25);
}
.front img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 24%;
}
.front::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(10,7,12,.86),transparent 45%);
}
.card-name{
  position:absolute;
  z-index:2;
  left:16px;
  right:16px;
  bottom:15px;
}
.card-name b{
  display:block;
  font-size:23px;
  line-height:1;
  letter-spacing:-.04em;
}
.card-name span{
  display:block;
  margin-top:6px;
  color:#f1c8d4;
  font-size:10px;
  letter-spacing:.12em;
}
.back{
  padding:20px;
  transform:rotateY(180deg);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:rgba(242,168,189,.35) transparent;
  background:
    linear-gradient(145deg,rgba(242,168,189,.09),transparent 46%),
    var(--panel2);
}
.back h2{margin:0;font-size:25px;letter-spacing:-.04em}
.back .alias{margin:5px 0 18px;color:var(--pink);font-size:10px;letter-spacing:.13em}
.setting{
  display:grid;
  gap:12px;
  color:#d7ccd6;
  font-size:12px;
  line-height:1.65;
}
.setting div{
  padding-bottom:10px;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.setting b{display:block;margin-bottom:3px;color:#8f8490;font-size:9px;letter-spacing:.12em}
.back-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:18px;
}
.action{
  min-height:38px;
  border:1px solid var(--line);
  border-radius:12px;
  color:var(--text);
  background:rgba(255,255,255,.055);
  cursor:pointer;
  font-size:11px;
}
.action:hover{border-color:rgba(242,168,189,.35)}

footer{
  margin-top:4px;
  padding:8px 0 12px;
  display:flex;
  justify-content:space-between;
  gap:20px;
  color:#776d79;
  font-size:10px;
}

.toast{
  position:fixed;left:50%;bottom:22px;z-index:90;
  transform:translate(-50%,12px);
  opacity:0;pointer-events:none;
  padding:10px 13px;border:1px solid var(--line);border-radius:12px;
  background:#211a26;color:white;font-size:11px;transition:.2s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:1550px){
  .gallery{grid-template-columns:repeat(6,1fr)}
  .gallery>.placeholder-item:nth-child(n+13){display:none}
}
@media(max-width:1320px){
  .gallery{grid-template-columns:repeat(5,1fr)}
  .gallery>.placeholder-item:nth-child(n+11){display:none}
}
@media(max-width:1080px){
  .gallery{grid-template-columns:repeat(4,1fr)}
  .gallery>.placeholder-item:nth-child(n+9){display:none}
}
@media(max-width:820px){
  .gallery{grid-template-columns:repeat(3,1fr)}
  .gallery>.placeholder-item:nth-child(n+7){display:none}
}
@media(max-width:620px){
  .catalog{grid-template-columns:22px minmax(0,1fr);gap:6px}
  .gallery{grid-template-columns:repeat(2,1fr)}
  .gallery>.placeholder-item:nth-child(n+5){display:none}
}
@media(max-width:430px){
  .wrap{width:min(100% - 10px,1720px)}
  main{padding-top:14px}
  .catalog{grid-template-columns:24px minmax(0,1fr);gap:7px}
  .side-title{font-size:11px;margin-top:3px}
  .gallery{gap:10px}
  .face{border-radius:16px}
  .card-name{left:12px;right:12px;bottom:12px}
  .card-name b{font-size:19px}
  .back{padding:14px}
  .back h2{font-size:21px}
  .setting{gap:8px;font-size:10px}
  .back-actions{grid-template-columns:1fr}
}

@media (min-width:900px) and (min-height:850px){
  .gallery{
    grid-auto-rows:clamp(300px,calc((100svh - 174px)/2),520px);
    align-content:start;
  }
  .card,
  .placeholder-card{
    width:100%;
    height:100%;
    aspect-ratio:auto;
  }
  .card-item{
    min-height:0;
  }
  main{
    padding-bottom:6px;
  }
  footer{
    margin-top:0;
    padding-top:6px;
    padding-bottom:8px;
  }
}

</style>

const works=[
  {
    name:"暮桃",
    alias:"MUTO",
    image:IMAGE,
    role:"便利店店员",
    personality:"安静、敏锐，习惯先观察再回应。",
    setting:"夜班便利店里总能见到她。她记得每位常客，却很少主动提起。",
    tags:["原创角色","角色卡"],
    creator:"霖霖"
  }
  /*
  继续添加：
  ,{
    name:"角色名",
    alias:"ALIAS",
    image:"图片地址或 data:image...",
    role:"身份",
    personality:"性格",
    setting:"背景设定",
    tags:["标签1","标签2"],
    creator:"霖霖"
  }
  */
];

const gallery=document.getElementById("gallery");
const toast=document.getElementById("toast");
let toastTimer;

function tip(text){
  toast.textContent=text;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove("show"),1700);
}

function safe(text){
  return String(text).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function cardHTML(work,index){
  const hint=index===0
    ? `<p class="first-hint">点击卡片查看设定 · 长按保存完整角色卡</p>`
    : "";
  return `
  <div class="card-item">
    <article class="card" data-index="${index}">
      <div class="card-inner">
        <div class="face front">
          <img src="${work.image}" alt="${safe(work.name)}">
          <div class="card-name">
            <b>${safe(work.name)}</b>
            <span>${safe(work.alias || "")}</span>
          </div>
        </div>
        <div class="face back">
          <div>
            <h2>${safe(work.name)}</h2>
            <p class="alias">${safe(work.alias || "")}</p>
            <div class="setting">
              <div><b>身份</b>${safe(work.role || "未填写")}</div>
              <div><b>性格</b>${safe(work.personality || "未填写")}</div>
              <div><b>设定</b>${safe(work.setting || "未填写")}</div>
            </div>
          </div>
          <div class="back-actions">
            <button class="action plain">仅图片 PNG</button>
            <button class="action json">JSON</button>
          </div>
        </div>
      </div>
    </article>
    ${hint}
  </div>`;
}

const DISPLAY_SLOTS=14;
const emptyCount=Math.max(0,DISPLAY_SLOTS-works.length);
const placeholders=Array.from({length:emptyCount},()=>`
  <div class="card-item placeholder-item" aria-hidden="true">
    <div class="placeholder-card"></div>
  </div>
`).join("");

gallery.innerHTML=works.map(cardHTML).join("")+placeholders;

function save(uri,name){
  const a=document.createElement("a");
  a.href=uri;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function saveBlob(blob,name){
  const url=URL.createObjectURL(blob);
  save(url,name);
  setTimeout(()=>URL.revokeObjectURL(url),1200);
}
function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}
async function toPng(src){
  const img=await loadImage(src);
  const canvas=document.createElement("canvas");
  canvas.width=img.naturalWidth;
  canvas.height=img.naturalHeight;
  canvas.getContext("2d").drawImage(img,0,0);
  return await new Promise((resolve,reject)=>canvas.toBlob(
    b=>b?resolve(b):reject(new Error("export failed")),"image/png"
  ));
}
function crc32(bytes){
  let crc=0xffffffff;
  for(const byte of bytes){
    crc^=byte;
    for(let i=0;i<8;i++) crc=(crc>>>1)^((crc&1)?0xedb88320:0);
  }
  return (crc^0xffffffff)>>>0;
}
function u32(v){
  return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);
}
function concat(...parts){
  const out=new Uint8Array(parts.reduce((n,p)=>n+p.length,0));
  let offset=0;
  parts.forEach(p=>{out.set(p,offset);offset+=p.length});
  return out;
}
function b64(bytes){
  let s="";
  for(let i=0;i<bytes.length;i+=0x8000)
    s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
  return btoa(s);
}
function textChunk(keyword,text){
  const enc=new TextEncoder();
  const type=enc.encode("tEXt");
  const data=concat(enc.encode(keyword),new Uint8Array([0]),enc.encode(text));
  return concat(u32(data.length),type,data,u32(crc32(concat(type,data))));
}
async function fullCardBlob(work){
  const plain=await toPng(work.image);
  const png=new Uint8Array(await plain.arrayBuffer());
  const sig=[0,0,0,0,73,69,78,68,174,66,96,130];
  let pos=-1;
  outer:for(let i=png.length-sig.length;i>=0;i--){
    for(let j=0;j<sig.length;j++) if(png[i+j]!==sig[j]) continue outer;
    pos=i;break;
  }
  if(pos<0) throw new Error("invalid png");
  const card={
    spec:"chara_card_v2",
    spec_version:"2.0",
    data:{
      name:work.name,
      description:work.setting || "",
      personality:work.personality || "",
      scenario:work.role || "",
      first_mes:"",
      mes_example:"",
      creator_notes:"",
      system_prompt:"",
      post_history_instructions:"",
      alternate_greetings:[],
      character_book:null,
      tags:work.tags || [],
      creator:work.creator || "",
      character_version:""
    }
  };
  const chunk=textChunk("chara",b64(new TextEncoder().encode(JSON.stringify(card))));
  return new Blob([png.slice(0,pos),chunk,png.slice(pos)],{type:"image/png"});
}

document.querySelectorAll(".card").forEach(card=>{
  const index=Number(card.dataset.index);
  const work=works[index];
  let timer=null,held=false,startX=0,startY=0;

  card.addEventListener("click",e=>{
    if(e.target.closest("button") || held){held=false;return}
    card.classList.toggle("flipped");
  });

  card.addEventListener("pointerdown",e=>{
    if(e.target.closest("button")) return;
    startX=e.clientX;startY=e.clientY;held=false;
    timer=setTimeout(async()=>{
      held=true;
      try{
        tip("正在生成完整角色卡");
        const blob=await fullCardBlob(work);
        saveBlob(blob,`${work.name}-character-card.png`);
        tip("开始下载完整 PNG");
      }catch{tip("生成失败")}
    },650);
  });
  card.addEventListener("pointermove",e=>{
    if(timer && Math.hypot(e.clientX-startX,e.clientY-startY)>12){
      clearTimeout(timer);timer=null;
    }
  });
  ["pointerup","pointercancel","pointerleave"].forEach(type=>
    card.addEventListener(type,()=>{clearTimeout(timer);timer=null})
  );
  card.addEventListener("contextmenu",e=>e.preventDefault());

  card.querySelector(".plain").addEventListener("click",async e=>{
    e.stopPropagation();
    try{
      const blob=await toPng(work.image);
      saveBlob(blob,`${work.name}-image.png`);
      tip("开始下载仅图片 PNG");
    }catch{tip("导出失败")}
  });
  card.querySelector(".json").addEventListener("click",e=>{
    e.stopPropagation();
    const data={
      name:work.name,
      alias:work.alias,
      role:work.role,
      personality:work.personality,
      setting:work.setting,
      tags:work.tags,
      creator:work.creator
    };
    saveBlob(
      new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"}),
      `${work.name}.json`
    );
    tip("开始下载 JSON");
  });
});
