<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a0f">
  <meta name="description" content="繁花·纷落角色卡档案，收录多个作者分区的 TAVO 角色卡。">
  <title>繁花·纷落｜角色卡档案</title>
  <style>
    :root{
      color-scheme:dark;--bg:#090a0f;--panel:#12141b;--line:rgba(255,255,255,.09);
      --text:#f5f0f4;--muted:#aaa3ad;--pink:#e8b6c7;--blue:#a9bbd9;
      --shell:min(1480px,calc(100% - 48px));--radius:18px
    }
    *{box-sizing:border-box}
    html{min-width:320px;background:var(--bg);scroll-behavior:smooth}
    body{
      min-width:320px;min-height:100vh;margin:0;overflow-x:hidden;color:var(--text);
      background:
        radial-gradient(900px 520px at 12% -10%,rgba(232,182,199,.09),transparent 62%),
        radial-gradient(880px 560px at 92% 10%,rgba(169,187,217,.08),transparent 64%),
        linear-gradient(180deg,#0d0e14,#090a0f 44%,#08090d);
      font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif
    }
    body.modal-open{overflow:hidden}
    button,a{font:inherit} button{border:0} img{max-width:100%}
    .shell{width:var(--shell);margin-inline:auto}
    .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

    .site-header{
      position:sticky;z-index:30;top:0;border-bottom:1px solid rgba(255,255,255,.065);
      background:rgba(9,10,15,.82);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2)
    }
    .header-inner{min-height:82px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px}
    .avatar-cycle{
      position:relative;width:52px;height:52px;padding:0;overflow:hidden;border:1px solid rgba(255,255,255,.16);
      border-radius:50%;background:#161820;box-shadow:0 8px 24px rgba(0,0,0,.26),0 0 0 4px rgba(255,255,255,.025);
      cursor:pointer;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease
    }
    .avatar-cycle:hover,.avatar-cycle:focus-visible{transform:translateY(-2px) rotate(-2deg);border-color:rgba(232,182,199,.48);outline:none}
    .avatar-cycle:disabled{cursor:wait;opacity:.55}
    .avatar-cycle img{width:100%;height:100%;display:block;object-fit:cover}
    .avatar-cycle::after{
      content:"↔";position:absolute;right:-1px;bottom:-1px;width:19px;height:19px;display:grid;place-items:center;
      border:1px solid rgba(255,255,255,.14);border-radius:50%;color:#fff;background:rgba(12,13,19,.88);font-size:9px
    }
    .author-heading{min-width:0}
    .author-heading strong{
      display:block;overflow:hidden;color:#fff;font-family:"Noto Serif SC","Songti SC",serif;
      font-size:clamp(18px,2vw,25px);font-weight:650;letter-spacing:.08em;text-overflow:ellipsis;white-space:nowrap
    }
    .author-heading span{display:block;margin-top:5px;overflow:hidden;color:rgba(219,212,222,.44);font-size:8px;letter-spacing:.19em;text-overflow:ellipsis;white-space:nowrap}
    .archive-count{min-width:108px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:4px 8px;text-align:right}
    .archive-count span{grid-column:1/-1;color:rgba(216,209,220,.38);font-size:7px;letter-spacing:.17em}
    .archive-count strong{color:#fff;font-family:Georgia,serif;font-size:25px;line-height:1}
    .archive-count small{color:rgba(216,209,220,.42);font-size:10px}

    main{padding:22px 0 52px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
    .author-tabs{display:flex;flex-wrap:wrap;gap:8px}
    .author-tab{
      min-height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border:1px solid var(--line);
      border-radius:999px;color:rgba(235,229,237,.55);background:rgba(255,255,255,.025);cursor:pointer;
      transition:color .18s ease,border-color .18s ease,background .18s ease,transform .18s ease
    }
    .author-tab:hover:not(:disabled),.author-tab:focus-visible{color:#fff;border-color:rgba(232,182,199,.27);transform:translateY(-1px);outline:none}
    .author-tab[aria-pressed="true"]{color:#fff;border-color:rgba(232,182,199,.28);background:linear-gradient(135deg,rgba(232,182,199,.12),rgba(169,187,217,.07))}
    .author-tab:disabled{cursor:wait;opacity:.48}
    .author-tab i{width:5px;height:5px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--blue));box-shadow:0 0 10px rgba(232,182,199,.32)}
    .author-tab b{font-size:10px;font-weight:600;letter-spacing:.05em}
    .author-tab small{color:rgba(220,213,223,.35);font-size:8px}
    .load-status{flex:0 0 auto;display:flex;align-items:center;gap:7px;color:rgba(220,213,223,.38);font-size:7px;letter-spacing:.16em;white-space:nowrap}
    .load-status i{width:6px;height:6px;border:1px solid rgba(232,182,199,.55);border-radius:50%}
    .load-status.is-ready i{border-color:var(--blue);background:var(--blue)}
    .load-status.is-error{color:#e3a7af}.load-status.is-error i{border-color:#e3a7af;background:#e3a7af}

    .gallery{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px 13px}
    .card{min-width:0;animation:cardIn .48s cubic-bezier(.2,.76,.2,1) both;animation-delay:min(calc(var(--order,0) * 25ms),250ms)}
    .card-frame{
      position:relative;aspect-ratio:.72;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:var(--radius);
      background:linear-gradient(150deg,#191b24,#0d0f14 65%,#090a0e);box-shadow:0 13px 30px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.03);
      isolation:isolate;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease
    }
    .card-frame::after{
      content:"";position:absolute;z-index:2;inset:0;pointer-events:none;
      background:linear-gradient(180deg,rgba(6,7,11,.02) 18%,rgba(6,7,11,.12) 55%,rgba(6,7,11,.84)),linear-gradient(125deg,rgba(232,182,199,.06),transparent 38%,rgba(169,187,217,.045))
    }
    .card-face{position:absolute;z-index:1;inset:0;width:100%;height:100%;padding:0;color:inherit;background:transparent;cursor:pointer}
    .card-face:focus-visible{outline:2px solid rgba(232,182,199,.68);outline-offset:-3px;border-radius:inherit}
    .card-image{width:100%;height:100%;display:block;object-fit:cover;object-position:center;transition:transform .5s cubic-bezier(.2,.72,.2,1),filter .35s ease,opacity .25s ease}
    .card-frame.image-error .card-image{opacity:0}
    .card-frame.image-error::before{
      content:"图片暂时无法加载";position:absolute;z-index:1;inset:0;display:grid;place-items:center;
      color:rgba(235,229,237,.38);font-size:9px;letter-spacing:.08em;background:linear-gradient(150deg,#1b1720,#10141c 58%,#090b10)
    }
    @media(hover:hover) and (pointer:fine){
      .card:hover .card-frame{transform:translateY(-5px);border-color:rgba(232,182,199,.22);box-shadow:0 22px 46px rgba(0,0,0,.3),0 0 25px rgba(232,182,199,.045)}
      .card:hover .card-image{transform:scale(1.035);filter:saturate(1.04) contrast(1.02)}
    }
    .card-tag,.card-index{
      position:absolute;z-index:3;top:10px;border:1px solid rgba(255,255,255,.12);
      background:rgba(8,9,13,.58);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)
    }
    .card-tag{left:10px;max-width:calc(100% - 56px);overflow:hidden;padding:6px 8px;border-radius:999px;color:rgba(255,255,255,.8);font-size:7px;letter-spacing:.05em;text-overflow:ellipsis;white-space:nowrap}
    .card-index{right:10px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:rgba(255,255,255,.58);font-family:Georgia,serif;font-size:9px}
    .card-caption{position:absolute;z-index:3;right:12px;bottom:62px;left:12px;text-align:left;pointer-events:none}
    .card-caption strong{
      display:block;overflow:hidden;color:#fff;font-family:"Noto Serif SC","Songti SC",serif;
      font-size:clamp(13px,1.28vw,18px);font-weight:650;letter-spacing:.055em;line-height:1.22;
      text-shadow:0 2px 12px rgba(0,0,0,.7);text-overflow:ellipsis;white-space:nowrap
    }
    .card-caption span{display:block;margin-top:5px;overflow:hidden;color:rgba(255,255,255,.58);font-size:7px;letter-spacing:.08em;text-shadow:0 1px 8px #000;text-overflow:ellipsis;white-space:nowrap}
    .card-actions{position:absolute;z-index:4;right:9px;bottom:9px;left:9px;display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:7px}
    .card-action{
      min-width:0;min-height:39px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 11px;
      border:1px solid rgba(255,255,255,.12);border-radius:11px;color:rgba(255,255,255,.8);background:rgba(8,9,13,.68);
      -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);cursor:pointer;
      transition:border-color .18s ease,background .18s ease,color .18s ease,transform .18s ease
    }
    .card-action:hover,.card-action:focus-visible{color:#fff;border-color:rgba(232,182,199,.32);background:rgba(24,20,28,.86);outline:none;transform:translateY(-1px)}
    .card-action:disabled{opacity:.56;cursor:wait}
    .card-action b{overflow:hidden;font-size:8px;font-weight:600;letter-spacing:.08em;text-overflow:ellipsis;white-space:nowrap}
    .card-action.download{padding:0;font-size:15px}

    .skeleton{aspect-ratio:.72;overflow:hidden;border:1px solid rgba(255,255,255,.05);border-radius:var(--radius);background:linear-gradient(150deg,#15171f,#0d0f14)}
    .skeleton::after{content:"";display:block;width:70%;height:140%;transform:translateX(-140%) rotate(14deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.045),transparent);animation:skeleton 1.35s ease-in-out infinite}
    .load-error-panel{grid-column:1/-1;min-height:260px;display:grid;place-items:center;padding:30px;border:1px solid var(--line);border-radius:var(--radius);text-align:center;background:rgba(255,255,255,.02)}
    .load-error-panel h2{margin:0;font-family:"Noto Serif SC",serif;font-size:22px}
    .load-error-panel p{max-width:560px;margin:10px auto 18px;color:var(--muted);font-size:12px;line-height:1.7}
    .retry-button{min-height:38px;padding:0 18px;border:1px solid rgba(232,182,199,.3);border-radius:999px;color:#fff;background:rgba(232,182,199,.1);cursor:pointer}

    footer{border-top:1px solid rgba(255,255,255,.055);color:rgba(220,213,223,.34);font-size:8px;letter-spacing:.1em}
    .footer-inner{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    footer a{color:rgba(232,182,199,.55);text-decoration:none}footer a:hover{text-decoration:underline}

    .modal{position:fixed;z-index:80;inset:0;display:grid;place-items:center;padding:26px;opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s ease}
    .modal.is-open{opacity:1;visibility:visible}
    .modal-backdrop{position:absolute;inset:0;width:100%;height:100%;background:rgba(3,4,7,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);cursor:pointer}
    .modal-panel{
      position:relative;z-index:1;width:min(1080px,100%);max-height:min(760px,calc(100vh - 52px));
      display:grid;grid-template-columns:minmax(300px,42%) minmax(0,1fr);overflow:hidden;
      border:1px solid rgba(255,255,255,.13);border-radius:24px;
      background:radial-gradient(440px 260px at 100% 0,rgba(169,187,217,.07),transparent 68%),linear-gradient(150deg,#14161e,#0d0f14 70%);
      box-shadow:0 36px 110px rgba(0,0,0,.62);transform:translateY(16px) scale(.98);transition:transform .28s cubic-bezier(.2,.78,.2,1)
    }
    .modal.is-open .modal-panel{transform:none}
    .modal-close{position:absolute;z-index:5;top:14px;right:14px;width:36px;height:36px;border:1px solid rgba(255,255,255,.13);border-radius:50%;color:#fff;background:rgba(7,8,12,.7);cursor:pointer}
    .modal-close:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
    .modal-visual{position:relative;min-height:570px;overflow:hidden;border-right:1px solid rgba(255,255,255,.08);background:#0b0d12}
    .modal-visual img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
    .modal-visual::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(6,7,11,.06),transparent 45%,rgba(6,7,11,.76))}
    .modal-visual-meta{
      position:absolute;z-index:2;right:14px;bottom:14px;left:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:11px 12px;border:1px solid rgba(255,255,255,.13);border-radius:13px;background:rgba(7,8,12,.64);
      -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)
    }
    .modal-visual-meta span{overflow:hidden;color:rgba(255,255,255,.72);font-size:8px;letter-spacing:.08em;text-overflow:ellipsis;white-space:nowrap}
    .modal-visual-meta small{flex:0 0 auto;color:rgba(255,255,255,.4);font-size:8px}
    .modal-content{min-width:0;overflow:auto;padding:34px 30px 30px}
    .modal-kicker{color:rgba(232,182,199,.55);font-size:7px;letter-spacing:.18em}
    .modal-title{margin:12px 44px 0 0;font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(27px,3vw,39px);font-weight:650;letter-spacing:.055em;line-height:1.2}
    .modal-alias{margin:7px 0 0;color:rgba(220,213,223,.43);font-size:8px;letter-spacing:.11em}
    .modal-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
    .modal-tags span{padding:6px 8px;border:1px solid rgba(255,255,255,.09);border-radius:999px;color:rgba(235,229,237,.58);background:rgba(255,255,255,.022);font-size:7px}
    .detail-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:24px;padding:5px;border:1px solid rgba(255,255,255,.075);border-radius:13px;background:rgba(255,255,255,.018)}
    .detail-tab{min-width:0;min-height:44px;padding:6px;border:1px solid transparent;border-radius:9px;color:rgba(224,217,226,.44);background:transparent;cursor:pointer}
    .detail-tab b{display:block;font-size:9px;font-weight:600;white-space:nowrap}.detail-tab small{display:block;margin-top:3px;color:rgba(232,182,199,.38);font-size:6px;letter-spacing:.08em}
    .detail-tab:hover,.detail-tab:focus-visible{color:#fff;outline:none}
    .detail-tab[aria-selected="true"]{color:#fff;border-color:rgba(232,182,199,.18);background:linear-gradient(135deg,rgba(232,182,199,.1),rgba(169,187,217,.045))}
    .detail-reader{margin-top:10px;min-height:230px;max-height:330px;overflow:auto;padding:18px;border:1px solid rgba(255,255,255,.075);border-radius:14px;background:rgba(5,6,9,.22);scrollbar-width:thin;scrollbar-color:rgba(232,182,199,.24) transparent}
    .detail-reader-head{display:flex;align-items:start;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.055)}
    .detail-reader-head h3{margin:0;font-family:"Noto Serif SC",serif;font-size:16px;letter-spacing:.07em}.detail-reader-head span{color:rgba(169,187,217,.48);font-size:7px;letter-spacing:.12em}
    .detail-copy{margin:15px 0 0;color:rgba(232,226,234,.68);font-size:11px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
    .modal-actions{display:flex;justify-content:flex-end;margin-top:16px}
    .modal-download{min-height:40px;display:inline-flex;align-items:center;gap:9px;padding:0 16px;border:1px solid rgba(232,182,199,.28);border-radius:999px;color:#fff;background:linear-gradient(135deg,rgba(232,182,199,.16),rgba(169,187,217,.09));cursor:pointer}
    .modal-download:disabled{opacity:.55;cursor:wait}

    .toast{
      position:fixed;z-index:120;right:20px;bottom:20px;max-width:min(360px,calc(100% - 40px));padding:12px 14px;
      border:1px solid rgba(255,255,255,.13);border-radius:13px;color:#fff;background:rgba(16,18,24,.92);
      box-shadow:0 22px 60px rgba(0,0,0,.32);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
      opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .2s ease,transform .2s ease
    }
    .toast.is-show{opacity:1;transform:none}.toast strong{display:block;font-size:11px}.toast span{display:block;margin-top:3px;color:rgba(230,224,232,.55);font-size:9px;line-height:1.5}

    @keyframes cardIn{from{opacity:0;transform:translateY(14px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
    @keyframes skeleton{to{transform:translateX(180%) rotate(14deg)}}
    @media(max-width:1180px){.gallery{grid-template-columns:repeat(4,minmax(0,1fr))}.card-caption strong{font-size:clamp(14px,1.9vw,18px)}}
    @media(max-width:760px){
      :root{--shell:min(100% - 28px,720px)}.header-inner{min-height:72px;gap:11px}.avatar-cycle{width:46px;height:46px}
      .archive-count{min-width:78px}.archive-count strong{font-size:21px}main{padding-top:16px}
      .toolbar{align-items:flex-start;flex-direction:column;gap:11px}.author-tabs{width:100%}
      .author-tab{flex:1 1 0;justify-content:center;padding-inline:8px}
      .gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 10px}.card-caption strong{font-size:clamp(13px,4vw,17px)}
      .modal{align-items:end;padding:0}.modal-panel{width:100%;max-height:94vh;grid-template-columns:1fr;overflow:auto;border-right:0;border-bottom:0;border-left:0;border-radius:22px 22px 0 0}
      .modal-visual{min-height:42vh;max-height:48vh;border-right:0;border-bottom:1px solid rgba(255,255,255,.08)}
      .modal-content{overflow:visible;padding:27px 16px calc(22px + env(safe-area-inset-bottom))}.detail-reader{max-height:none}
      .footer-inner{min-height:66px;align-items:flex-start;justify-content:center;flex-direction:column;gap:6px;padding-block:16px}
    }
    @media(max-width:430px){
      :root{--shell:calc(100% - 20px)}.author-heading span{font-size:6.5px;letter-spacing:.13em}.archive-count span{font-size:6px}.author-tab b{font-size:9px}
      .card-frame{border-radius:14px}.card-tag{top:7px;left:7px;max-width:calc(100% - 44px);padding:5px 7px;font-size:6.5px}
      .card-index{top:7px;right:7px;width:24px;height:24px;font-size:8px}.card-caption{right:9px;bottom:54px;left:9px}.card-caption span{font-size:6.5px}
      .card-actions{right:6px;bottom:6px;left:6px;grid-template-columns:minmax(0,1fr) 34px;gap:5px}.card-action{min-height:35px;padding-inline:8px;border-radius:9px}
      .detail-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.toast{right:10px;bottom:10px;max-width:calc(100% - 20px)}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <button class="avatar-cycle" id="avatarCycle" type="button" aria-label="切换作者分区" disabled>
        <img id="authorAvatar" alt="作者头像" width="52" height="52">
      </button>
      <div class="author-heading">
        <strong id="authorName">繁花·纷落</strong>
        <span id="authorEnglish">FANHUA · FENLUO / CHARACTER CARD ARCHIVE</span>
      </div>
      <div class="archive-count" aria-label="当前作者卡片数与总卡片数">
        <span>ARCHIVE / TOTAL</span><strong id="authorCount">—</strong><small id="totalCount">/ —</small>
      </div>
    </div>
  </header>

  <main class="shell">
    <div class="toolbar">
      <div class="author-tabs" id="authorTabs" aria-label="作者分区">
        <button class="author-tab" type="button" data-author="fanhuafenluo" aria-pressed="true" disabled><i></i><b>繁花·纷落</b><small>—</small></button>
        <button class="author-tab" type="button" data-author="shark" aria-pressed="false" disabled><i></i><b>鲨鱼</b><small>—</small></button>
        <button class="author-tab" type="button" data-author="wa" aria-pressed="false" disabled><i></i><b>咓</b><small>—</small></button>
      </div>
      <div class="load-status" id="loadStatus" role="status" aria-live="polite"><i></i><span>LOADING SOURCE</span></div>
    </div>
    <section class="gallery" id="gallery" aria-label="角色卡档案">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </section>
  </main>

  <footer>
    <div class="shell footer-inner">
      <span>© 2026 繁花·纷落 · 98 CARD ARCHIVE</span>
      <span>角色资料来源：<a href="https://hqu35785-cmyk.github.io/fanhuafenluo/index.html" target="_blank" rel="noopener">繁花·纷落角色档案</a></span>
    </div>
  </footer>

  <div class="modal" id="detailModal" aria-hidden="true">
    <button class="modal-backdrop" type="button" data-close-modal aria-label="关闭角色档案"></button>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭角色档案">×</button>
      <div class="modal-visual">
        <img id="modalImage" alt="角色卡卡面预览">
        <div class="modal-visual-meta"><span id="modalIdentity">角色卡</span><small id="modalIndex">ARCHIVE · 01</small></div>
      </div>
      <div class="modal-content">
        <div class="modal-kicker">CHARACTER PROFILE</div>
        <h2 class="modal-title" id="modalTitle">角色名</h2>
        <p class="modal-alias" id="modalAlias">TAVO CHARACTER CARD</p>
        <div class="modal-tags" id="modalTags"></div>
        <div class="detail-tabs" role="tablist" aria-label="角色档案内容">
          <button class="detail-tab" type="button" role="tab" data-detail="intro" aria-selected="true"><b>简介</b><small>INTRO</small></button>
          <button class="detail-tab" type="button" role="tab" data-detail="opening" aria-selected="false"><b>开场白</b><small>OPENING</small></button>
          <button class="detail-tab" type="button" role="tab" data-detail="setting" aria-selected="false"><b>人物设定</b><small>SETTING</small></button>
          <button class="detail-tab" type="button" role="tab" data-detail="worldbook" aria-selected="false"><b>世界书</b><small>LOREBOOK</small></button>
        </div>
        <section class="detail-reader" role="tabpanel" tabindex="0">
          <div class="detail-reader-head"><h3 id="detailTitle">简介</h3><span id="detailType">INTRO</span></div>
          <p class="detail-copy" id="detailCopy"></p>
        </section>
        <div class="modal-actions">
          <button class="modal-download" id="modalDownload" type="button"><span>⇩</span><b>保存原始角色卡 PNG</b></button>
        </div>
      </div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"><strong></strong><span></span></div>
  <noscript><p class="shell">此页面需要启用 JavaScript 才能读取角色卡资料。</p></noscript>

  <script>
    const SOURCE_BASE='https://hqu35785-cmyk.github.io/fanhuafenluo/';
    const PNG_CDN_BASE='https://cdn.jsdelivr.net/gh/hqu35785-cmyk/fanhuafenluo@main/';
    const PNG_RAW_BASE='https://raw.githubusercontent.com/hqu35785-cmyk/fanhuafenluo/main/';
    const SOURCE_URLS={
      works:'src/data/works.js?v=49902ffceff5',
      details:{
        fanhuafenluo:'src/data/details-fanhua.js?v=da80d31cbb75',
        shark:'src/data/details-shark.js?v=v3lazy',
        wa:'src/data/details-wa.js?v=v3lazy'
      }
    };
    const AUTHOR_ORDER=['fanhuafenluo','shark','wa'];
    const AUTHOR_META={
      fanhuafenluo:{name:'繁花·纷落',english:'FANHUA · FENLUO',avatar:'assets/authors/fanhuafenluo-avatar.webp'},
      shark:{name:'鲨鱼',english:'SHARK · CHARACTER ARCHIVE',avatar:'assets/authors/shark.webp'},
      wa:{name:'咓',english:'WA · CHARACTER ARCHIVE',avatar:'assets/authors/wa.webp'}
    };
    const DETAIL_META={
      intro:{title:'简介',type:'INTRO'},opening:{title:'开场白',type:'OPENING'},
      setting:{title:'人物设定',type:'SETTING'},worldbook:{title:'世界书',type:'LOREBOOK'}
    };

    const state={catalog:null,activeAuthor:'fanhuafenluo',activeWork:null,activeIndex:0,lastFocus:null};
    const gallery=document.getElementById('gallery');
    const loadStatus=document.getElementById('loadStatus');
    const authorAvatar=document.getElementById('authorAvatar');
    const authorName=document.getElementById('authorName');
    const authorEnglish=document.getElementById('authorEnglish');
    const authorCount=document.getElementById('authorCount');
    const totalCount=document.getElementById('totalCount');
    const authorTabs=document.getElementById('authorTabs');
    const avatarCycle=document.getElementById('avatarCycle');
    const detailModal=document.getElementById('detailModal');
    const modalClose=document.getElementById('modalClose');
    const modalDownload=document.getElementById('modalDownload');
    const detailReader=document.querySelector('.detail-reader');
    const toast=document.getElementById('toast');
    let toastTimer=0;

    function sourceUrl(path){
      if(!path) return '';
      try{return new URL(path,SOURCE_BASE).href}catch{return String(path)}
    }
    function escapeHtml(value){
      return String(value ?? '').replace(/[&<>"']/g,char=>({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
      })[char]);
    }
    function readJsonBlock(source,start,openChar,closeChar){
      const open=source.indexOf(openChar,start);
      if(open<0) throw new Error('数据块起始位置不存在');
      let depth=0,inString=false,escaped=false;
      for(let i=open;i<source.length;i++){
        const char=source[i];
        if(inString){
          if(escaped) escaped=false;
          else if(char==='\\') escaped=true;
          else if(char==='"') inString=false;
          continue;
        }
        if(char==='"'){inString=true;continue}
        if(char===openChar) depth++;
        else if(char===closeChar){
          depth--;
          if(depth===0) return {value:JSON.parse(source.slice(open,i+1)),end:i+1};
        }
      }
      throw new Error('数据块不完整');
    }
    function extractConstArray(source,name){
      const marker=`const ${name} =`;
      const start=source.indexOf(marker);
      if(start<0) throw new Error(`未找到 ${name}`);
      return readJsonBlock(source,start+marker.length,'[',']').value;
    }
    function parseDetailsData(source,authorId){
      const details={};
      const markers=[
        `window.__LAZY_DETAILS__.${authorId}=`,
        `Object.assign(window.__LAZY_DETAILS__.${authorId},`
      ];
      markers.forEach(marker=>{
        let cursor=0;
        while(cursor<source.length){
          const found=source.indexOf(marker,cursor);
          if(found<0) break;
          const objectStart=source.indexOf('{',found+marker.length);
          const statementEnd=source.indexOf(';',found+marker.length);
          if(objectStart<0 || (statementEnd>=0 && statementEnd<objectStart)){
            cursor=found+marker.length;
            continue;
          }
          try{
            const block=readJsonBlock(source,objectStart,'{','}');
            Object.assign(details,block.value);
            cursor=block.end;
          }catch{
            cursor=objectStart+1;
          }
        }
      });
      return details;
    }
    async function fetchText(path){
      const response=await fetch(sourceUrl(path),{cache:'no-cache'});
      if(!response.ok) throw new Error(`${path} 加载失败（${response.status}）`);
      return response.text();
    }
    function setStatus(text,mode='loading'){
      loadStatus.querySelector('span').textContent=text;
      loadStatus.classList.toggle('is-ready',mode==='ready');
      loadStatus.classList.toggle('is-error',mode==='error');
    }

    async function loadCatalog(){
      setStatus('LOADING · 98 CARDS');
      authorTabs.querySelectorAll('button').forEach(button=>button.disabled=true);
      avatarCycle.disabled=true;
      try{
        const [worksSource,fanhuaDetails,sharkDetails,waDetails]=await Promise.all([
          fetchText(SOURCE_URLS.works),fetchText(SOURCE_URLS.details.fanhuafenluo),
          fetchText(SOURCE_URLS.details.shark),fetchText(SOURCE_URLS.details.wa)
        ]);
        const rawCatalog={
          fanhuafenluo:[...extractConstArray(worksSource,'latestFanhuaWorks'),...extractConstArray(worksSource,'fanhuaWorks')],
          shark:extractConstArray(worksSource,'sharkWorks'),
          wa:extractConstArray(worksSource,'waWorks')
        };
        const detailCatalog={
          fanhuafenluo:parseDetailsData(fanhuaDetails,'fanhuafenluo'),
          shark:parseDetailsData(sharkDetails,'shark'),
          wa:parseDetailsData(waDetails,'wa')
        };
        const catalog={};
        AUTHOR_ORDER.forEach(authorId=>{
          catalog[authorId]=rawCatalog[authorId].map(work=>({
            ...work,...(detailCatalog[authorId][work._detailKey || work.image] || {})
          }));
        });
        const total=AUTHOR_ORDER.reduce((sum,id)=>sum+catalog[id].length,0);
        const detailsComplete=AUTHOR_ORDER.every(id=>catalog[id].every(work=>work.opening && work.personality && work.setting));
        if(total!==98 || !detailsComplete) throw new Error(`源站数据不完整（读取到 ${total} 张）`);
        state.catalog=catalog;
        AUTHOR_ORDER.forEach(id=>{
          const button=authorTabs.querySelector(`[data-author="${id}"]`);
          button.querySelector('small').textContent=String(catalog[id].length);
          button.disabled=false;
        });
        avatarCycle.disabled=false;
        totalCount.textContent=`/ ${total}`;
        renderAuthor(state.activeAuthor);
      }catch(error){
        console.error(error);
        setStatus('SOURCE LOAD ERROR','error');
        gallery.innerHTML=`<div class="load-error-panel"><div><h2>角色资料暂时未能载入</h2><p>${escapeHtml(error.message || '请检查网络连接后重试。')}</p><button class="retry-button" type="button" id="retryLoad">重新读取角色源</button></div></div>`;
        document.getElementById('retryLoad').addEventListener('click',loadCatalog,{once:true});
      }
    }

    function cardTemplate(work,index){
      const tag=work.cardLabel || work.tags?.[0] || '角色卡';
      const preview=sourceUrl(work.preview || work.image);
      const priority=index<6?'eager':'lazy';
      const fetchPriority=index<2?'high':'low';
      const number=String(index+1).padStart(2,'0');
      return `
        <article class="card" data-index="${index}" style="--order:${index%12}">
          <div class="card-frame">
            <button class="card-face" type="button" data-action="details" aria-label="查看${escapeHtml(work.name)}档案">
              <img class="card-image" src="${escapeHtml(preview)}" alt="${escapeHtml(work.name)}角色卡卡面" loading="${priority}" fetchpriority="${fetchPriority}" decoding="async">
              <span class="card-tag">${escapeHtml(tag)}</span><span class="card-index">${number}</span>
              <span class="card-caption"><strong>${escapeHtml(work.name)}</strong><span>${escapeHtml(work.alias || work.collectionLabel || 'ORIGINAL CHARACTER')}</span></span>
            </button>
            <div class="card-actions">
              <button class="card-action" type="button" data-action="details"><b>查看档案</b><span>↗</span></button>
              <button class="card-action download" type="button" data-action="download" aria-label="保存${escapeHtml(work.name)}原始角色卡 PNG">⇩</button>
            </div>
          </div>
        </article>`;
    }
    function renderAuthor(authorId){
      if(!state.catalog || !state.catalog[authorId]) return;
      state.activeAuthor=authorId;
      const meta=AUTHOR_META[authorId],works=state.catalog[authorId];
      authorAvatar.src=sourceUrl(meta.avatar);
      authorAvatar.alt=`${meta.name}头像`;
      authorName.textContent=meta.name;
      authorEnglish.textContent=`${meta.english} / CHARACTER CARD ARCHIVE`;
      authorCount.textContent=String(works.length);
      avatarCycle.title=`当前为${meta.name}，点击切换下一位作者`;
      authorTabs.querySelectorAll('[data-author]').forEach(button=>{
        button.setAttribute('aria-pressed',String(button.dataset.author===authorId));
      });
      gallery.innerHTML=works.map(cardTemplate).join('');
      setStatus(`READY · ${works.length} / 98`,'ready');
    }
    function activeWorkFromCard(card){
      const index=Number(card?.dataset.index);
      return {work:state.catalog?.[state.activeAuthor]?.[index],index};
    }
    function detailText(work,key){
      if(key==='intro') return [work.role,work.personality].filter(Boolean).join('\n\n') || '该角色卡未提供简介。';
      if(key==='opening') return work.opening || '该角色卡未提供开场白。';
      if(key==='setting') return work.setting || '该角色卡未提供人物设定。';
      return work.worldbook || work.lorebook || '该角色卡未包含世界书。';
    }
    function openDetails(work,index,trigger){
      if(!work) return;
      state.activeWork=work;state.activeIndex=index;state.lastFocus=trigger || document.activeElement;
      const image=document.getElementById('modalImage');
      image.src=sourceUrl(work.preview || work.image);image.alt=`${work.name}角色卡卡面预览`;
      document.getElementById('modalTitle').textContent=work.name;
      document.getElementById('modalAlias').textContent=`${work.alias || 'ORIGINAL CHARACTER'} · ${work.collectionLabel || 'CHARACTER CARD'}`;
      document.getElementById('modalIdentity').textContent=work.cardLabel || work.tags?.[0] || '角色卡';
      document.getElementById('modalIndex').textContent=`ARCHIVE · ${String(index+1).padStart(2,'0')}`;
      const tags=[...(work.tags || [])];
      if(work.creator && !tags.includes(work.creator)) tags.push(work.creator);
      document.getElementById('modalTags').innerHTML=tags.map(tag=>`<span>${escapeHtml(tag)}</span>`).join('');
      setDetailTab('intro');
      detailModal.classList.add('is-open');detailModal.setAttribute('aria-hidden','false');
      document.body.classList.add('modal-open');
      window.setTimeout(()=>modalClose.focus({preventScroll:true}),80);
    }
    function closeDetails(){
      if(!detailModal.classList.contains('is-open')) return;
      detailModal.classList.remove('is-open');detailModal.setAttribute('aria-hidden','true');
      document.body.classList.remove('modal-open');
      const focusTarget=state.lastFocus;
      if(focusTarget && document.contains(focusTarget)) window.setTimeout(()=>focusTarget.focus({preventScroll:true}),40);
    }
    function setDetailTab(key){
      const meta=DETAIL_META[key] || DETAIL_META.intro;
      document.querySelectorAll('[data-detail]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.detail===key)));
      document.getElementById('detailTitle').textContent=meta.title;
      document.getElementById('detailType').textContent=meta.type;
      document.getElementById('detailCopy').textContent=detailText(state.activeWork || {},key);
      detailReader.scrollTop=0;
    }
    function safeFilename(name){
      return String(name || 'character-card').replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim();
    }
    function originalPngCandidates(path){
      const relative=String(path || '').replace(/^\.\//,'').replace(/^\//,'');
      return [...new Set([sourceUrl(relative),PNG_CDN_BASE+relative,PNG_RAW_BASE+relative])];
    }
    async function fetchOriginalPng(path){
      let lastError=null;
      for(const url of originalPngCandidates(path)){
        const controller=new AbortController();
        const timeout=window.setTimeout(()=>controller.abort(),30000);
        try{
          const response=await fetch(url,{credentials:'omit',mode:'cors',cache:'force-cache',signal:controller.signal});
          if(!response.ok) throw new Error(`PNG 加载失败（${response.status}）`);
          const blob=await response.blob();
          const signature=new Uint8Array(await blob.slice(0,8).arrayBuffer());
          const expected=[137,80,78,71,13,10,26,10];
          if(!blob.size || expected.some((byte,index)=>signature[index]!==byte)) throw new Error('返回内容不是有效 PNG');
          return blob;
        }catch(error){
          lastError=error;
        }finally{
          window.clearTimeout(timeout);
        }
      }
      throw lastError || new Error('原始 PNG 暂时不可用');
    }
    async function downloadCard(work,button){
      if(!work || button?.disabled) return;
      const oldHtml=button?.innerHTML;
      if(button){button.disabled=true;button.setAttribute('aria-busy','true');button.textContent='…'}
      try{
        const blob=await fetchOriginalPng(work.image);
        const objectUrl=URL.createObjectURL(blob);
        const link=document.createElement('a');
        link.href=objectUrl;link.download=`${safeFilename(work.name)}-character-card.png`;link.hidden=true;
        document.body.appendChild(link);link.click();link.remove();
        window.setTimeout(()=>URL.revokeObjectURL(objectUrl),10000);
        showToast('原始 PNG 下载已开始',`${work.name} · ${(blob.size/1024/1024).toFixed(1)} MB`);
      }catch(error){
        console.error(error);showToast('角色卡保存失败',error.message || '请稍后重试。');
      }finally{
        if(button){button.disabled=false;button.removeAttribute('aria-busy');button.innerHTML=oldHtml}
      }
    }
    function showToast(title,message){
      toast.querySelector('strong').textContent=title;toast.querySelector('span').textContent=message;
      toast.classList.remove('is-show');void toast.offsetWidth;toast.classList.add('is-show');
      window.clearTimeout(toastTimer);toastTimer=window.setTimeout(()=>toast.classList.remove('is-show'),2800);
    }

    authorTabs.addEventListener('click',event=>{
      const button=event.target.closest('[data-author]');
      if(button && !button.disabled) renderAuthor(button.dataset.author);
    });
    avatarCycle.addEventListener('click',()=>{
      if(!state.catalog) return;
      const current=AUTHOR_ORDER.indexOf(state.activeAuthor);
      renderAuthor(AUTHOR_ORDER[(current+1)%AUTHOR_ORDER.length]);
    });
    gallery.addEventListener('click',event=>{
      const action=event.target.closest('[data-action]'),card=event.target.closest('.card');
      if(!action || !card) return;
      const {work,index}=activeWorkFromCard(card);
      if(action.dataset.action==='details') openDetails(work,index,action);
      if(action.dataset.action==='download') downloadCard(work,action);
    });
    gallery.addEventListener('error',event=>{
      const image=event.target;
      if(!image.classList?.contains('card-image')) return;
      const {work}=activeWorkFromCard(image.closest('.card'));
      if(work && image.dataset.fallback!=='1'){image.dataset.fallback='1';image.src=sourceUrl(work.image)}
      else image.closest('.card-frame')?.classList.add('image-error');
    },true);
    document.querySelector('.detail-tabs').addEventListener('click',event=>{
      const button=event.target.closest('[data-detail]');
      if(button) setDetailTab(button.dataset.detail);
    });
    modalClose.addEventListener('click',closeDetails);
    document.querySelectorAll('[data-close-modal]').forEach(button=>button.addEventListener('click',closeDetails));
    modalDownload.addEventListener('click',()=>downloadCard(state.activeWork,modalDownload));
    document.addEventListener('keydown',event=>{if(event.key==='Escape') closeDetails()});
    loadCatalog();
  </script>
</body>
</html>
